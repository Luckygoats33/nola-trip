<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="V2 · New Orleans trip hub: what is open now, a real map, the plan, saved places, and tattoo ideas.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#D2614C">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>New Orleans Trip Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:ital,wght@1,700&family=Nunito+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 1985 Miami lanai. Wicker-and-banana-leaf header with a script logo, pastel tabs, one view at a time; each tab opens with a line from one of the four girls. */
:root{
  --bg:#FFF4EF;  --surface:#FFFFFF; --sunk:#FBE7DF; --ink:#2E2433; --muted:#6F6274; --line:#EBD3CB;
  --accent:#2F7F73; --accent-ink:#FFFFFF; --accent-soft:#D6EFE9;   /* seafoam: Rose */
  --coral:#D2614C;  --coral-soft:#FCE1DA;                          /* coral: Blanche */
  --lav:#7558AE;    --lav-soft:#ECE4F7;                            /* lavender: Dorothy */
  --gold:#9C6C14;   --gold-soft:#F7EAD0;                           /* gold: Sophia */
  --leaf:#5C9A6A;   --wicker:#D8B98E;
  --warn:#9A2F22;   --warn-soft:#FBE3DE; --scrim:rgba(46,36,51,.5);
  --water:#B9DDE6; --safe:#2E8B4E; --mid:#D19A12; --risk:#C23B32;
  --script:"Pacifico", "Brush Script MT", cursive;
  --display:"Playfair Display", Georgia, serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1622; --surface:#261E2D; --sunk:#30263A; --ink:#F6ECEF; --muted:#BBAEC0; --line:#3E3249;
    --accent:#7FD3C3; --accent-ink:#10201D; --accent-soft:#1E3B37;
    --coral:#F59A86; --coral-soft:#4A2622; --lav:#C2ACEC; --lav-soft:#33284A; --gold:#E8BE6A; --gold-soft:#3D3018;
    --leaf:#79B888; --wicker:#6B5638; --warn:#F2A394; --warn-soft:#45231E; --scrim:rgba(0,0,0,.6); --water:#1F4450; --safe:#4CC27A; --mid:#F0C04A; --risk:#F06A5E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1622; --surface:#261E2D; --sunk:#30263A; --ink:#F6ECEF; --muted:#BBAEC0; --line:#3E3249;
  --accent:#7FD3C3; --accent-ink:#10201D; --accent-soft:#1E3B37;
  --coral:#F59A86; --coral-soft:#4A2622; --lav:#C2ACEC; --lav-soft:#33284A; --gold:#E8BE6A; --gold-soft:#3D3018;
  --leaf:#79B888; --wicker:#6B5638; --warn:#F2A394; --warn-soft:#45231E; --scrim:rgba(0,0,0,.6); --water:#1F4450; --safe:#4CC27A; --mid:#F0C04A; --risk:#F06A5E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 72px}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.8rem}
h3{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.15rem}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--coral)}

/* header: wicker strip + leaves */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-inline:-16px;padding:0 16px;border-bottom:1px solid var(--line)}
.wicker{height:8px;margin-inline:-16px;background:
  repeating-linear-gradient(45deg,var(--wicker) 0 3px,transparent 3px 7px),
  repeating-linear-gradient(-45deg,var(--wicker) 0 3px,var(--sunk) 3px 7px)}
.top-row{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding-top:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.logo{font-family:var(--script);font-weight:400;font-size:1.9rem;color:var(--coral);line-height:1.2}
.logo span{color:var(--accent)}
.sub{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.sync{font-family:var(--mono);font-size:.72rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.sync.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.leaf{position:absolute;right:-6px;top:-4px;width:86px;height:86px;opacity:.22;pointer-events:none}
.leaf path{fill:var(--leaf)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab .n{font-family:var(--mono);font-size:.7rem;margin-left:5px;color:var(--coral)}
.tab[aria-selected="true"] .n{color:var(--gold-soft)}
main{padding-top:20px;display:grid;gap:20px}
.view{display:grid;gap:18px}
.head{display:grid;gap:4px}

/* girl talk */
.talk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;background:var(--lav-soft);border:1px solid var(--line)}
.talk[data-g="Blanche"]{background:var(--coral-soft)}
.talk[data-g="Rose"]{background:var(--accent-soft)}
.talk[data-g="Sophia"]{background:var(--gold-soft)}
.badge-g{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--script);font-size:1.2rem;color:var(--surface);background:var(--lav)}
.talk[data-g="Blanche"] .badge-g{background:var(--coral)}
.talk[data-g="Rose"] .badge-g{background:var(--accent);color:var(--accent-ink)}
.talk[data-g="Sophia"] .badge-g{background:var(--gold)}
.talk q{font-style:italic;quotes:"\201C" "\201D"}
.talk .who-g{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:2px}
.talk > div{min-width:0}
.again{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}

/* picture it */
.picture{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:12px}
.picture .line{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(1.3rem,3.6vw,1.9rem);line-height:1.2}
.picture .line em{font-style:italic;color:var(--coral)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{border-radius:999px;padding:4px 12px;font-size:.85rem;background:var(--sunk);font-weight:600}
.fact b{font-family:var(--mono);font-weight:500;color:var(--coral)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted);min-width:0}
.field{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font:inherit;color:var(--ink);min-width:0;width:100%}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border-radius:10px;padding:10px 14px;background:var(--sunk);font-size:.9rem}
.alert .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--accent)}
.alert.good .dot{background:var(--leaf)} .alert.heads .dot{background:var(--coral)} .alert.fun .dot{background:var(--lav)}

/* chips & controls */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.cake[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--surface)}
input.search{flex:1 1 220px;width:auto;background:var(--surface)}
select.field{flex:0 1 auto;width:auto;background:var(--surface)}
.count{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--coral)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:hover{color:var(--coral)}
.card h3 button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--muted)}
.meta .mono{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--mono);font-size:.68rem;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.ok{font-size:.72rem;font-weight:800;padding:1px 9px;border-radius:999px}
.ok.Dorothy{background:var(--lav-soft);color:var(--lav)} .ok.Blanche{background:var(--coral-soft);color:var(--coral)}
.ok.Rose{background:var(--accent-soft);color:var(--accent)} .ok.Sophia{background:var(--gold-soft);color:var(--gold)}
.note{font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cakebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;flex-shrink:0}
.cakebtn svg{width:18px;height:18px}
.cakebtn .crust{fill:var(--wicker)} .cakebtn .body{fill:none;stroke:var(--coral);stroke-width:1.6} .cakebtn .berry{fill:none}
.cakebtn[aria-pressed="true"]{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.cakebtn[aria-pressed="true"] .body{fill:var(--surface)} .cakebtn[aria-pressed="true"] .berry{fill:var(--coral)}
.faces{display:inline-flex}
.faces img,.faces span.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;background:var(--sunk);object-fit:cover}
.faces img:first-child,.faces span.dot:first-child{margin-left:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}

/* plan */
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:10px}
.day-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.date-tag{font-family:var(--mono);font-size:.78rem;color:var(--coral);font-weight:500}
.who{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{display:grid;grid-template-columns:78px 1fr;gap:12px;padding-block:10px;border-top:1px dashed var(--line)}
ol.tl li:first-child{border-top:0}
.t{font-family:var(--mono);font-size:.85rem;color:var(--accent);padding-top:1px}
li.key .t{color:var(--coral);font-weight:500}
.what{display:grid;gap:4px;min-width:0}
.what b{font-weight:800}
.what .d{font-size:.9rem;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:5px}
.plink{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
.plink:hover{border-color:var(--coral);color:var(--coral)}
.plink.picked{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
.alt{font-size:.88rem;color:var(--muted);border-left:3px solid var(--wicker);padding-left:12px;display:grid;gap:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;align-content:start}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.best{color:var(--coral);font-weight:800}
.callout{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.warn b:first-child{color:var(--warn)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.two > *{min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px}

/* checklist */
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.check{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;width:100%}
.box-ic{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center}
.check[aria-checked="true"] .box-ic{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] .box-ic::after{content:"";width:10px;height:6px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.check[aria-checked="true"] .lbl{color:var(--muted);text-decoration:line-through}
.progress{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--coral))}

/* budget */
.bar{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:.88rem}
.track{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.fill{display:block;height:100%;background:var(--coral);border-radius:99px}
.bar .v{font-family:var(--mono);text-align:right}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;align-items:end;justify-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:85%;overflow:auto;padding:20px;display:grid;gap:12px;border:1px solid var(--line)}
.sheet-top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.close{border:1px solid var(--line);background:var(--sunk);border-radius:999px;width:32px;height:32px;flex-shrink:0;font-size:1.1rem;line-height:1}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.85rem;z-index:50;max-width:calc(100% - 32px)}
/* open now */
.nowbtn{border:0;background:var(--coral);color:var(--surface);border-radius:999px;padding:7px 16px;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.nowbtn .pulse{width:9px;height:9px;border-radius:50%;background:var(--surface);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.nowbtn .pulse{animation:none}}
.clock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.clock .big{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(1.3rem,3.6vw,1.8rem);line-height:1.2}
.clock .big em{color:var(--coral);font-style:italic}
.whenrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.whenrow .field{width:auto;background:var(--surface)}
.chip.live[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--surface)}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.sum{border-radius:12px;padding:8px 14px;background:var(--sunk);display:grid;gap:0;min-width:96px}
.sum b{font-family:var(--mono);font-size:1.4rem;font-weight:500;line-height:1.1}
.sum span{font-size:.75rem;color:var(--muted);font-weight:700}
.sum.open b{color:var(--leaf)} .sum.soon b{color:var(--coral)} .sum.later b{color:var(--gold)}
.sect{display:grid;gap:8px}
.sect > h3{display:flex;align-items:baseline;gap:8px}
.sect > h3 .c{font-family:var(--mono);font-style:normal;font-weight:400;font-size:.8rem;color:var(--muted)}
.grp{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.res .nm{all:unset;cursor:pointer;font-weight:800;min-width:0}
.res .nm:hover{color:var(--coral)}
.res .nm:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.res .sub2{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--muted)}
.res .right{display:flex;gap:6px;align-items:center}
.st{font-family:var(--mono);font-size:.72rem;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.st.open{background:var(--accent-soft);color:var(--accent)}
.st.closing{background:var(--gold-soft);color:var(--gold)}
.st.soon,.st.now{background:var(--coral-soft);color:var(--coral)}
.st.later{background:var(--gold-soft);color:var(--gold)}
.st.closed,.st.unknown{background:var(--sunk);color:var(--muted)}
.ev-time{font-family:var(--mono);font-size:1rem;color:var(--coral);font-weight:500}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.more summary{cursor:pointer;font-weight:800}
details.more p{margin-top:8px;font-size:.88rem;color:var(--muted)}
.today{font-size:.82rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hrs{width:100%;min-width:0;font-size:.85rem;border-collapse:collapse}
.hrs td{padding:3px 8px 3px 0;border:0}
.hrs tr.is-today td{font-weight:800;color:var(--coral)}
.srcline{font-size:.75rem;color:var(--muted)}
/* grouped filters + why */
.fgroups{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.fg{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start}
.fg-l{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:7px}
.fg-c{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.whybox{display:grid;gap:6px;justify-items:start;border-radius:14px;padding:12px 16px;background:var(--gold-soft);border:1px solid var(--line)}
.why{font-style:italic;color:var(--ink);font-size:.9rem}
.why b{font-style:normal}
details.cat{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.cat > summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:12px 16px}
details.cat > summary::-webkit-details-marker{display:none}
details.cat > summary::before{content:"+";font-family:var(--mono);color:var(--coral);width:12px}
details.cat[open] > summary::before{content:"–"}
details.cat > summary .t2{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.1rem}
details.cat > summary .c{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
details.cat > summary .hint{flex-basis:100%;font-size:.85rem;color:var(--muted);padding-left:18px}
details.cat[open] > summary .hint{display:none}
details.cat .body{display:grid;gap:8px;padding:0 12px 12px}
details.cat .body .why{padding:4px 6px 2px}
.stop{all:unset;cursor:pointer;font-weight:800}
.stop:hover{color:var(--coral)}
.stop:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.stop::after{content:" ›";color:var(--coral);font-weight:400}
.stop[aria-expanded="true"]::after{content:" ⌄"}
.stopbody{display:grid;gap:6px;border-left:3px solid var(--coral-soft);padding-left:10px}
@media (max-width:600px){ .fg{grid-template-columns:1fr;gap:4px} .fg-l{padding-top:0} }
.chip .cn{font-family:var(--mono);font-size:.72rem;font-weight:500;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip[aria-pressed="true"] .cn{background:var(--surface);color:var(--accent)}
.chip.zero{opacity:.55}
.mapwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
svg.map{display:block;width:100%;height:auto;max-height:72vh;touch-action:none;cursor:grab;user-select:none}
svg.map .zone{stroke-width:1.5;vector-effect:non-scaling-stroke;fill-opacity:.24;stroke-opacity:.7}
svg.map .zone.green{fill:var(--safe);stroke:var(--safe)} svg.map .zone.yellow{fill:var(--mid);stroke:var(--mid)} svg.map .zone.red{fill:var(--risk);stroke:var(--risk)}
svg.map .hood{fill:var(--muted);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
svg.map .st-l{fill:var(--muted);font-family:var(--body);font-style:italic;pointer-events:none}
svg.map .pin{cursor:pointer} svg.map .pin:hover circle:nth-child(2),svg.map .pin:focus circle:nth-child(2){stroke:var(--coral)}
svg.map .pin-l{fill:var(--ink);font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:.35;pointer-events:none}
.hscroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}.hscroll>*{flex-shrink:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid var(--ink)}
.safety{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.sz{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:.9rem}
.sw{width:18px;height:18px;border-radius:5px;margin-top:2px}
.sw.green{background:var(--safe)} .sw.yellow{background:var(--mid)} .sw.red{background:var(--risk)}
li.bk{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;gap:0;overflow:hidden}
li.bk .check{border:0;border-radius:0;border-bottom:1px dashed var(--line)}
li.bk .num{font-family:var(--mono);font-size:.75rem;color:var(--coral);margin-right:4px}
.bk-body{padding:10px 14px 14px;display:grid;gap:8px}
li.bk.done .bk-body{opacity:.6}
.tips{margin:0;padding-left:18px;display:grid;gap:3px;font-size:.88rem;color:var(--muted)}
@media (max-width:600px){
  ol.tl li{grid-template-columns:62px 1fr;gap:10px}
  .bar{grid-template-columns:105px 1fr 48px}
  .kv{grid-template-columns:72px 1fr}
  .talk{grid-template-columns:auto 1fr}
  .talk .again{grid-column:1 / -1;justify-self:start}
  .leaf{width:64px;height:64px}
}

/* ---- phone-first sizing ---- */
.chip{min-height:40px;padding:8px 14px}
.btn{min-height:44px;padding:8px 14px;font-size:.85rem}
.btn.big{font-size:.95rem;padding:10px 18px}
.plink{min-height:36px;padding:6px 12px}
.field{font-size:16px;min-height:44px}
.cakebtn{min-height:40px;padding:6px 12px 6px 10px}
.tab{display:flex;align-items:center;gap:6px}
.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab .n{font-family:var(--mono);font-size:.68rem;background:var(--coral);color:var(--surface);border-radius:999px;padding:0 6px}
.hbtn{min-height:36px;padding:4px 12px}
@media (max-width:899px){
  body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .tab{flex:1 1 0;flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:4px 2px;border:0;border-radius:12px;background:transparent;font-size:.72rem}
  .tab svg{width:22px;height:22px}
  .tab[aria-selected="true"]{background:var(--coral-soft);color:var(--coral);border:0}
  .tab .n{position:absolute;margin:-30px 0 0 26px}
  .tab{position:relative}
  .sheet{border-radius:18px 18px 0 0;width:100%;max-height:88dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .scrim{padding:0}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .logo{font-size:1.5rem}
  .top-row .sub{display:none}
  .leaf{display:none}
}
@media (orientation:landscape) and (max-height:500px){ .top .wicker{display:none} .logo{font-size:1.2rem} .leafmap,.leaf-host .leaflet-container{height:80dvh} }
/* ---- next two hours ---- */
.next2{background:var(--surface);border:2px solid var(--coral);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.n2-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.n2-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.n2-col{display:grid;gap:6px;align-content:start;min-width:0}
.n2-item{all:unset;cursor:pointer;display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-height:44px}
.n2-item:hover,.n2-item:focus-visible{border-color:var(--coral);outline:none}
.n2-item span{font-size:.8rem;color:var(--muted)}
/* ---- votes ---- */
.votes{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:6px 12px;font-weight:800;font-size:.82rem;display:inline-flex;align-items:center;gap:6px}
.vote.v-must[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--surface)}
.vote.v-maybe[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.vote.v-skip[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:var(--surface)}
/* ---- itinerary travel + fixed/flex ---- */
ol.tl li.conn{border-top:0;padding-block:0 2px;font-size:.78rem;color:var(--muted);font-family:var(--mono)}
ol.tl li.conn.tight{color:var(--warn)}
.fx{justify-self:start;font-family:var(--mono);font-size:.68rem;padding:1px 8px;border-radius:999px}
.fx.fixed{background:var(--lav-soft);color:var(--lav)} .fx.flex{background:var(--sunk);color:var(--muted)}
/* ---- version switch ---- */
.vswitch{display:flex;justify-content:center;align-items:center;gap:6px;margin-inline:-16px;padding:6px 16px;background:var(--ink);color:var(--bg);font-size:.78rem}
.vswitch span{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-right:4px}
.vswitch a{color:var(--bg);text-decoration:none;font-weight:800;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);min-height:32px;display:inline-flex;align-items:center}
.vswitch a[aria-current="page"]{background:var(--bg);color:var(--ink);border-color:var(--bg)}
/* ---- ink ---- */
.ink-sec{display:grid;gap:10px;scroll-margin-top:120px}
.ink-head{display:flex;gap:12px;align-items:center}
.ink-num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--mono);flex-shrink:0}
.ink-num.custom{background:#8E5BD6;color:#fff}
.ink-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ink-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;align-content:start}
.ink-card.star{border:2px solid var(--coral)}
.ink-card.custom{border-color:#B48AF0}
.ink-art{all:unset;cursor:zoom-in;display:block;background:var(--surface);border-bottom:1px dashed var(--line);padding:10px;color:var(--ink)}
.ink-art:focus-visible{outline:2px solid var(--coral);outline-offset:-4px}
.ink-art svg{display:block;width:100%;height:auto;aspect-ratio:1}
.inkart *{vector-effect:non-scaling-stroke}
.inkart{stroke-width:1.4}
.ink-meta{padding:12px 14px 14px;display:grid;gap:8px}
.ink-meta h3{font-size:1rem}
.ink-large{color:var(--ink);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:8px}
.ink-large svg{display:block;width:100%;max-width:440px;margin:0 auto;height:auto;aspect-ratio:1}
/* ---- real map ---- */
.mapslot{position:relative}
.maplock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:600;border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:800;font-size:.85rem;background:var(--ink);color:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap}
.maplock.on{background:var(--coral);color:var(--surface)}
@media (pointer:coarse){ svg.map{touch-action:pan-y} }
@media (max-width:899px){ .leafmap{height:min(60vh,520px)} }
.mapwrap{position:relative;z-index:0;isolation:isolate}
.leafmap{height:min(68dvh,620px);width:100%;display:block}
.leaflet-container{font-family:var(--body);background:var(--sunk)}
.leafmap.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.leaflet-tooltip{font-family:var(--body);font-weight:700}
.clu{background:var(--coral);color:var(--surface);border:3px solid var(--surface);border-radius:50%;display:grid!important;place-items:center;font-family:var(--mono);font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;font-size:20px!important}

 "grrlspot":{"hours":null,"hoursText":"Roving queer women's dance party with no fixed venue or schedule. It takes over different bars (e.g. GrandPre's, Toulouse Theatre, Saddle Bar). Sources disagree on frequency: 'nearly monthly', 'every few months', or '3rd Saturday'. Biggest parties are at Mardi Gras, Pride and Southern Decadence. Dates and locations are announced on GrrlSpot's Instagram (@grrlspot) and in Ambush Mag's monthly calendar.","times":[],"reserve":"Walk-in only","price":null,"detail":"Open to all gender identities and allies. Check Instagram for the next date and venue; there was no confirmed Oct 2026 event.","url":"https://www.instagram.com/grrlspot/","source":"https://www.axios.com/local/new-orleans/2023/07/12/lesbian-bars-grrlspot ; https://outxout.com/guides/lesbian-bars-and-safe-spaces-in-new-orleans-la","confidence":"low"},
 "soileddove":{"hours":null,"hoursText":"Monthly pop-up on the third Thursday at 10pm at Palm&Pine (308 N Rampart St). The next would be Thu Oct 15, 2026. Listings are undated, so confirm on Instagram that it is still running.","times":[{"days":["thu"],"nth3":true,"start":"22:00","durationMin":180,"label":"The Soiled Dove pop-up"}],"reserve":"Walk-in only","price":null,"detail":"Pop-up lesbian bar night with drag performances and karaoke. New Orleans has no permanent lesbian bar.","url":"https://www.palmandpinenola.com/","source":"https://www.neworleans.com/blog/post/the-queer-womans-guide-to-new-orleans/ ; https://outxout.com/guides/lesbian-bars-and-safe-spaces-in-new-orleans-la","confidence":"low"},
 "royal":{"hours":{"mon":[["10:00","17:00"]],"tue":[["10:00","17:00"]],"wed":[["10:00","17:00"]],"thu":[["10:00","17:00"]],"fri":[["10:00","17:00"]],"sat":[["10:00","17:00"]],"sun":[]},"hoursText":"Typical pattern: antique dealers open Mon–Sat about 9/10am to 5pm. Many fine-antiques shops are closed or appointment-only on Sunday (M.S. Rau, Moss, Royal Antiques), though general retail on Royal is often open Sundays about 10/11am–5/6pm. Hours vary by shop.","times":[],"reserve":"Walk-in only","price":null,"detail":"Royal Street becomes a pedestrian mall roughly 11am–4pm, which makes daytime browsing easy. Go on a weekday or Saturday; Sunday is hit or miss for antiques.","url":"https://www.neworleans.com/plan/streets/royal-street/","source":"https://www.frenchquarter.com/nola/royal-antiques-ltd./1589 ; https://www.mossantiques.com/contact-us/ ; M.S. Rau site","confidence":"medium"},
 "msrau":{"hours":{"mon":[["09:00","17:15"]],"tue":[["09:00","17:15"]],"wed":[["09:00","17:15"]],"thu":[["09:00","17:15"]],"fri":[["09:00","17:15"]],"sat":[["09:00","17:15"]],"sun":[]},"hoursText":"Mon–Sat 9:00am–5:15pm. Closed Sunday and major holidays. After-hours visits by appointment.","times":[],"reserve":"Walk-in only","price":"Free to browse","detail":"Museum-like gallery (founded 1912) of fine art, antiques and jewelry, including Monet and Picasso works. Free to walk in; the showroom also uses the 630 Royal entrance.","url":"https://www.rauantiques.com/","source":"https://www.rauantiques.com/ (hours via search snippet of official site/blog)","confidence":"high"},

 "magazine":{"hours":{"mon":[["10:00","17:00"]],"tue":[["10:00","17:00"]],"wed":[["10:00","17:00"]],"thu":[["10:00","17:00"]],"fri":[["10:00","17:00"]],"sat":[["10:00","17:00"]],"sun":[["12:00","16:00"]]},"hoursText":"General pattern, not shop-specific: boutiques mostly open about 10/11am to 5/6pm Mon–Sat, with shorter Sunday hours (often noon–4/5pm). Some are closed Mon or Tue. First Saturday of the month, many merchants stay open late (about 5–8pm).","times":[],"reserve":"Walk-in only","price":null,"detail":"The six-mile strip is best done in clusters (Lower Garden District, Uptown around Napoleon/Jefferson) by streetcar or car. The magazinestreet.com directory has each shop's hours.","url":"https://www.magazinestreet.com/","source":"https://worldtravelguide.net/guides/north-america/united-states-of-america/louisiana/new-orleans/shopping ; https://www.darkgarden.com/nola/ ; https://countryroadsmagazine.com/events/first-saturdays-on-magazine/","confidence":"low"},
 "ponchatoula":{"hours":null,"hoursText":"Small independent shops and antique malls on E Pine St (Railroad Ave to 6th St), each with its own hours. No consolidated schedule was found. Expect roughly 10am–5pm, with some shops closed Sun/Mon. Saturday is the safest day. Antique Trade Days are the first full weekend of March and November (likely Nov 7–8, 2026, 9am–5pm).","times":[],"reserve":"Walk-in only","price":null,"detail":"About 45–60 min from New Orleans via I-55. Stops include Collinswood Antiques Mall, Mary's Antiques & Quilts and Time & Again / B2 Antiques (165 E Pine). Trade Days draw 15,000+ visitors, so avoid them if you want quiet browsing.","url":"https://ponchatoulachamber.com/","source":"https://www.wbrz.com/news/ponchatoula-chamber-of-commerce-hosts-biannual-ponchatoula-antique-trade-days-arts-and-crafts-fair ; https://www.myneworleans.com/louisiana-life-travel-a-guide-to-antiquing/","confidence":"low"},
 "stl1":{"hours":{"mon":[["09:00","16:00"]],"tue":[["09:00","16:00"]],"wed":[["09:00","16:00"]],"thu":[["09:00","16:00"]],"fri":[["09:00","16:00"]],"sat":[["09:00","16:00"]],"sun":[["09:00","16:00"]]},"hoursText":"Entry only on an authorized guided tour. Daytime tours run roughly 9:00 to 14:00/16:00. Sample 2026 slots from resellers: 09:00, 09:30, 09:45, 10:00, 10:45, 11:30, 13:30 and 14:00. There are also night tours at 17:15, 18:15 and 19:15, and an after-dark tour on Saturdays (some Fridays) from 19:45 to 21:15. I could not confirm the operator's own schedule, so slots vary by date.","times":[{"days":["mon","tue","wed","thu","fri","sat","sun"],"start":"09:00","durationMin":45,"label":"Official walking tour"},{"days":["mon","tue","wed","thu","fri","sat","sun"],"start":"10:00","durationMin":45,"label":"Official walking tour"},{"days":["mon","tue","wed","thu","fri","sat","sun"],"start":"11:30","durationMin":45,"label":"Official walking tour"},{"days":["mon","tue","wed","thu","fri","sat","sun"],"start":"13:30","durationMin":45,"label":"Official walking tour"},{"days":["mon","tue","wed","thu","fri","sat","sun"],"start":"14:00","durationMin":45,"label":"Official walking tour"}],"reserve":"Tickets required","price":"About $25–33 per adult depending on day and seller (Tripster: $28.85–29.12, regular $33). Guide gratuity is not included.","detail":"Check-in and departure are inside Basin St. Station, 501 Basin St (not at the cemetery gate). Arrive 10–15 minutes early to collect your tickets and wristband or sticker. Tours run in all weather, so bring water and wear comfortable shoes.","url":"https://www.tripster.com/detail/st-louis-cemetery-no-1-official-tour-new-orleans","source":"https://uk.trip.com/things-to-do/detail/106862137/ ; https://www.tripster.com/detail/st-louis-cemetery-no-1-official-tour-new-orleans","confidence":"low"},
 "anansi":{"hours":null,"hoursText":"The operator site does not publish a schedule. Expedia lists a 10:00 start (1 hr 45 min). An older (May 2025) Marriott listing showed 11:00 and 13:30 slots. Check the booking page for the date.","times":[{"days":["mon","tue","wed","thu","fri","sat","sun"],"start":"10:00","durationMin":105,"label":"NOLA Voodoo Walking Tour with High Priestess Guide"}],"reserve":"Reservations required","price":"From about $25 (AAA listing, plus taxes and fees). Other resellers show higher converted prices.","detail":"Meet at the Louis Armstrong Park main entrance, 901 N. Rampart St, across Rampart from St. Ann St (or outside the gated entrance by the brass band statue if you are already inside the park). There is no break and there are no restrooms in the park, so bring water, sunscreen and an umbrella. Phone (504) 544-0119.","url":"https://www.anansisdaughters.com/","source":"https://www.anansisdaughters.com/tour-starting-locations ; https://www.expedia.com.my/things-to-do/nola-voodoo-walking-tour-with-high-priestess-guide-in-new-orleans.a44487533.activity-details ; https://www.aaa.com/tripcanvas/thing-to-do/nola-voodoo-walking-tour-with-high-priestess-guide-in-new-orleans-353780P2","confidence":"low"},

const DOWS = ALLD, DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const toM = s => { const [h,m]=String(s).split(":").map(Number); return h*60+(m||0); };
const fmtM = m => { m=((m%1440)+1440)%1440; let h=Math.floor(m/60); const mm=m%60, ap=h>=12?"pm":"am"; h=h%12||12; return h+(mm?":"+String(mm).padStart(2,"0"):"")+" "+ap; };
const dur = m => m<60 ? m+" min" : Math.floor(m/60)+" hr"+(m%60?" "+(m%60)+" min":"");
function nolaNow(){
  const pr = new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",weekday:"short",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g = t => (pr.find(x=>x.type===t)||{}).value;
  const h = +g("hour")%24;
  return {date:g("year")+"-"+g("month")+"-"+g("day"), dow:DOWS.indexOf(g("weekday").toLowerCase().slice(0,3)), mins:h*60+(+g("minute"))};
}
function shiftW(W, addMins){
  let m = W.mins + addMins, dd = Math.floor(m/1440); m = ((m%1440)+1440)%1440;
  const dow = ((W.dow+dd)%7+7)%7;
  const date = W.date ? addD(parseD(W.date), dd).toISOString().slice(0,10) : null;
  return {date, dow, mins:m};
}
function statusAt(p, W){
  const h = p.hrs && p.hrs.hours; if(!h) return {state:"unknown"};
  const t = W.mins, today = h[DOWS[W.dow]]||[], yday = h[DOWS[(W.dow+6)%7]]||[];
  for(const [o,c] of today){ const O=toM(o), C=toM(c);
    if(C<=O){ if(t>=O) return {state:"open", left:C+1440-t, closeLabel:fmtM(C)}; }
    else if(t>=O && t<C) return {state:"open", left:C-t, closeLabel:fmtM(C)}; }
  for(const [o,c] of yday){ const O=toM(o), C=toM(c); if(C<=O && t<C) return {state:"open", left:C-t, closeLabel:fmtM(C)}; }
  const later = today.map(w=>toM(w[0])).filter(O=>O>t).sort((a,b)=>a-b)[0];
  if(later!=null) return {state:"later", opensIn:later-t, openLabel:fmtM(later)};
  return {state:"closed"};
}
function eventsAt(p, W, horizon){
  const out = [];
  ((p.hrs && p.hrs.times) || []).forEach(ev=>{
    if(ev.days && !ev.days.includes(DOWS[W.dow])) return;
    if(ev.dates && (!W.date || !ev.dates.includes(W.date))) return;
    if(ev.nth3){ if(!W.date) return; const dd=+W.date.slice(8); if(dd<15||dd>21) return; }
    const S0 = toM(ev.start), len = ev.durationMin||60, B = ev.board ? toM(ev.board) : null;
    if(W.mins>=S0 && W.mins<S0+len) out.push({p, ev, state:"now", start:S0, end:S0+len, board:B});
    else if(S0>W.mins && S0-W.mins<=horizon) out.push({p, ev, state:"soon", start:S0, inMins:S0-W.mins, board:B});
  });
  return out;
}
function todayText(p, dow){
  const h = p.hrs && p.hrs.hours; if(!h) return null;
  const w = h[DOWS[dow]]||[]; if(!w.length) return "Closed";
  return w.map(([o,c])=>fmtM(toM(o))+"–"+fmtM(toM(c))).join(", ");
}
function pill(st){
  if(st.state==="open") return st.left<=60 ? '<span class="st closing">Closes in '+dur(st.left)+'</span>' : '<span class="st open">Open till '+st.closeLabel+'</span>';
  if(st.state==="later") return '<span class="st later">Opens '+st.openLabel+'</span>';
  if(st.state==="closed") return '<span class="st closed">Closed</span>';
  return '<span class="st unknown">Check hours</span>';
}

/* dates */
const DAY = 864e5;
const parseD = s => { if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d]=s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d,12)); };
const addD = (dt,n) => new Date(dt.getTime()+n*DAY);
const fmtD = (dt,o) => dt.toLocaleDateString("en-US",Object.assign({timeZone:"UTC"},o));
const dayLabel = dt => fmtD(dt,{weekday:"short",month:"short",day:"numeric"});
function todayUTC(){ const n=new Date(); return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate(),12)); }

/* sunset for New Orleans (NOAA approximation), returned as local Central time */
function sunsetNOLA(dt){
  const lat=29.951, lon=-90.072, rad=Math.PI/180;
  const y=dt.getUTCFullYear(), m=dt.getUTCMonth(), d=dt.getUTCDate();
  const N = Math.round((Date.UTC(y,m,d)-Date.UTC(y,0,0))/DAY);
  const lngH = lon/15, t = N + ((18-lngH)/24);
  const M = 0.9856*t - 3.289;
  let L = M + 1.916*Math.sin(M*rad) + 0.020*Math.sin(2*M*rad) + 282.634; L=((L%360)+360)%360;
  let RA = Math.atan(0.91764*Math.tan(L*rad))/rad; RA=((RA%360)+360)%360;
  RA = (RA + (Math.floor(L/90)*90 - Math.floor(RA/90)*90))/15;
  const sinDec = 0.39782*Math.sin(L*rad), cosDec = Math.cos(Math.asin(sinDec));
  const cosH = (Math.cos(90.833*rad) - sinDec*Math.sin(lat*rad)) / (cosDec*Math.cos(lat*rad));
  const H = Math.acos(cosH)/rad/15;
  let UT = (H + RA - 0.06571*t - 6.622 - lngH); UT=((UT%24)+24)%24; if(UT<12) UT+=24;
  const when = new Date(Date.UTC(y,m,d) + UT*3600e3);
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit",hour12:false}).formatToParts(when);
  const hh=+parts.find(x=>x.type==="hour").value, mm=+parts.find(x=>x.type==="minute").value;
  const label = when.toLocaleTimeString("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit"});
  return {label, mins: (hh%24)*60+mm};
}
function cruiseVerdict(ss){
  if(ss.mins < 17*60+50) return "The sun is down before boarding, so this is a city-lights cruise. For golden light on the water, take the 2:30 daytime cruise instead.";
  if(ss.mins < 19*60) return "Sunset happens at the dock while you board. Be on the top deck by 6:00.";
  if(ss.mins < 19*60+30) return "Sunset lands right around departure. Perfect timing.";
  return "Sunset happens out on the water. The best possible timing.";
}
function tripInfo(){
  const A=parseD(trip.arrive), D=parseD(trip.depart);
  if(!A) return null;
  const nights = D ? Math.round((D-A)/DAY) : null;
  const dateOf = n => addD(A,n-1);
  return {A,D,nights,dateOf};
}
function alerts(){
  const ti = tripInfo(); if(!ti) return [];
  const {A,D,nights,dateOf} = ti, out = [];
  if(D && nights<1) return [["heads","Your departure date is before your arrival date. Check the trip details."]];
  const last = D || addD(A,4);
  const days=[]; for(let x=A; x<=last; x=addD(x,1)) days.push(x);
  if(nights!=null && nights<4) out.push(["heads","The plan has 4 nights and you have "+nights+". Merge or drop the days that fall after "+dayLabel(D)+"."]);
  if(nights!=null && nights>=5) out.push(["good","You have "+nights+" nights, so the optional Day 5 is on. Pick River Road, Northshore, or Battlefield + Saints."]);
  const d2 = dateOf(2).getUTCDay();
  if(d2===0||d2===1) out.push(["heads","Day 2 is a "+fmtD(dateOf(2),{weekday:"long"})+", and Bayou Bar has no live music Sunday or Monday. Swap Days 2 and 3."]);
  const ss = sunsetNOLA(dateOf(4));
  out.push(["fun","Cruise night is "+dayLabel(dateOf(4))+". Sunset is about "+ss.label+". "+cruiseVerdict(ss)]);
  days.forEach(x=>{ if(x.getUTCDay()===4 && x.getUTCDate()>=15 && x.getUTCDate()<=21) out.push(["good","The Soiled Dove lesbian pop-up at Palm&Pine is on "+dayLabel(x)+", 10 pm–1 am. It's a third Thursday."]); });
  days.forEach(x=>{
    const md = fmtD(x,{month:"numeric",day:"numeric"}), y=x.getUTCFullYear();
    if(y===2026 && md==="10/31") out.push(["fun","You're in town for Halloween. The Creole Queen Haunted Halloween Cruise has an open bar and a tarot reader on board, $125."]);
    if(y===2026 && md==="10/24") out.push(["fun","Oct 24: the Witches Brew Brunch cruise on the Creole Queen, 11:00–12:30."]);
    if(y===2026 && md==="10/30") out.push(["fun","Oct 30: the Witches Lunch cruise on the CITY of NEW ORLEANS, 3 cocktails included."]);
  });
  if(days.some(x=>x.getUTCDay()===6||x.getUTCDay()===0)) out.push(["good","There's a weekend in your trip, so the jazz brunch cruises are an option."]);
  out.push(["heads","Check the Saints schedule for a home game on your dates."]);
  return out;
}

  h += '<div class="whenrow" role="group" aria-label="Time"><button class="chip live" data-when="live" aria-pressed="'+live+'">Right now</button><button class="chip" data-when="plus1">+1 hour</button><button class="chip" data-when="tonight">Tonight 9 pm</button><button class="chip" data-when="late">Late night 1 am</button><button class="chip" data-when="tomorrow">Tomorrow 10 am</button></div>';
  let opts = "";
  if(ti){ const n = ti.D ? Math.round((ti.D-ti.A)/DAY)+1 : 5; for(let i=1;i<=n;i++){ const x=ti.dateOf(i), v=x.toISOString().slice(0,10); opts += '<option value="d:'+v+'"'+(W.date===v&&!live?' selected':'')+'>Trip day '+i+' · '+esc(dayLabel(x))+'</option>'; } }
  DOWL.forEach((nm,i)=>{ opts += '<option value="w:'+i+'"'+(!live&&!W.date&&W.dow===i?' selected':'')+'>Any '+nm+'</option>'; });
  const hh = String(Math.floor(W.mins/60)).padStart(2,"0")+":"+String(W.mins%60).padStart(2,"0");
  h += '<div class="whenrow"><label class="small muted" for="nowday">Or pick a time</label><select class="field" id="nowday">'+(live?'<option value="">Today</option>':'')+opts+'</select><input class="field" id="nowtime" type="time" value="'+hh+'" aria-label="Time of day"></div>'
    + '<div class="row"><button class="btn primary big" data-next2="1">Find me something for the next 2 hours</button><button class="btn" data-locate="1">◎ Near me</button>'+(originPt()?'<span class="small muted">Distances from '+originPt().from+'.</span>':'')+'</div></div>';
  if(S.next2) h += vNext2(W);
  /* counts of what's open (or starting soon) per type, ignoring the type filter */
  const q = (S.nowQ||"").trim().toLowerCase();
  const isOpenish = p => isSailing(p) ? eventsAt(p,W,240).length>0 : (statusAt(p,W).state==="open" || eventsAt(p,W,240).length>0);
  const lateOk = p => { const st=statusAt(p,W); return st.state==="open" && (W.mins+st.left)>=24*60; };
  const base = P.filter(p => (!S.walkOnly||p.d===0) && (!S.nowPicks||pickersOf(p.id).length) && (!S.nowLate||lateOk(p)) && (!q||hay(p).includes(q)));
  const counts = {all: base.filter(isOpenish).length};
  Object.keys(CATS).forEach(c=>{ counts[c] = base.filter(p=>p.c.includes(c) && isOpenish(p)).length; });
  const search = '<div class="fg"><span class="fg-l">Search</span><div class="fg-c"><input class="field search" id="nowq" type="search" placeholder="Try vegan, rooftop, beignets, Frenchmen, tarot…" value="'+esc(S.nowQ||"")+'" aria-label="Search what\'s open">'
    + (q?'<button class="btn" data-clearq="1">Clear</button>':'')+'</div></div>';
  h += filterBlock(S.nowCat, "data-ncat", '<button class="chip" id="walkOnly" aria-pressed="'+S.walkOnly+'">Walkable only</button><button class="chip" id="nowLate" aria-pressed="'+!!S.nowLate+'">Open past midnight</button><button class="chip cake" id="nowPicks" aria-pressed="'+S.nowPicks+'">Kitchen table only</button>', counts, search);
  h += '<p class="small muted">Numbers show how many are open or starting soon at this time.</p>';
  const list = base.filter(p => (S.nowCat==="all"||p.c.includes(S.nowCat)));
  if(q){
    const ranked = list.map(p=>{ const st=statusAt(p,W), ev=eventsAt(p,W,240)[0]; const rank = (st.state==="open"||ev)?0 : st.state==="later"?1 : st.state==="unknown"?2 : 3; return {p,st,ev,rank}; })
      .sort((a,b)=>a.rank-b.rank || a.p.d-b.p.d);
    h += '<section class="sect"><h3>Results for “'+esc(S.nowQ.trim())+'” <span class="c">'+ranked.filter(r=>r.rank===0).length+' open of '+ranked.length+'</span></h3>'
      + (ranked.length ? ranked.map(r=> r.ev && (isSailing(r.p)||r.st.state!=="open") ? evRow(r.ev) : resRow(r.p, r.st)).join("") : '<div class="empty">Nothing matches “'+esc(S.nowQ.trim())+'”. Try a simpler word, or clear the type filter.</div>')
      + '</section>';
    return h + '<p class="small muted">Hours come from each venue\'s site or listings, researched October 2026. Call ahead for anything you\'re counting on.</p>';
  }
  const events = list.flatMap(p=>eventsAt(p,W,240).slice(0,2)).sort((a,b)=>(a.state==="now"?-1:0)-(b.state==="now"?-1:0) || a.start-b.start);
  const evIds = new Set(events.map(e=>e.p.id));
  const rows = list.filter(p=>!isSailing(p)).map(p=>({p, st:statusAt(p,W)}));
  const dcmp = (x,y)=>{ const a=distInfo(x), b=distInfo(y); return (a&&b) ? a.m-b.m : x.d-y.d; };
  const open = rows.filter(r=>r.st.state==="open").sort((a,b)=>dcmp(a.p,b.p) || a.p.n.localeCompare(b.p.n));
  const later = rows.filter(r=>r.st.state==="later").sort((a,b)=>a.st.opensIn-b.st.opensIn);
  const closed = rows.filter(r=>r.st.state==="closed");
  const unknown = rows.filter(r=>r.st.state==="unknown" && !evIds.has(r.p.id));
  h += '<div class="summary"><div class="sum open"><b>'+open.length+'</b><span>Open now</span></div><div class="sum soon"><b>'+events.length+'</b><span>Starting within 4 hrs</span></div><div class="sum later"><b>'+later.length+'</b><span>Opening later</span></div><div class="sum"><b>'+closed.length+'</b><span>Closed</span></div></div>';
  /* collapsible sections: tap the header to open; each one says why first */
  const sec = (key, title, count, hint, why, inner, defOpen) => {
    const isOpen = S.secs[key]!==undefined ? S.secs[key] : defOpen;
    return '<details class="cat"'+(isOpen?' open':'')+'><summary data-sec="'+key+'"><span class="t2">'+esc(title)+'</span><span class="c">'+count+'</span><span class="hint">'+esc(hint)+'</span></summary>'
      +'<div class="body">'+(why?'<p class="why"><b>Why go:</b> '+esc(why)+'</p>':'')+inner+'</div></details>';
  };
  const single = S.nowCat!=="all";
  h += '<p class="small muted">Open and closed are <b>estimates</b> from posted hours, last checked Oct 11, 2026, not live from the venue. Tap a section to open it. Each one tells you why it\'s worth it, then what\'s open.</p>';
  if(events.length) h += sec("ev", "Shows, tours, and cruises", events.length+" starting soon", "Set start times: "+events.slice(0,3).map(e=>fmtM(e.start)+" "+(e.ev.label||e.p.n)).join(" · "), "These run on a clock. Get there for the start, or wait for the next one.", events.map(evRow).join(""), true);
  if(open.length){
    GROUP_ORDER.forEach(c=>{
      const g = open.filter(r=>GROUP_ORDER.find(x=>r.p.c.includes(x))===c);
      if(!g.length) return;
      h += sec("o-"+c, CATS[c], g.length+" open now", g.slice(0,3).map(r=>r.p.n).join(", ")+(g.length>3?" and more":""), CAT_WHY[c], g.map(r=>resRow(r.p,r.st)).join(""), single);
    });
  } else h += '<div class="empty">Nothing on the list is open at this time'+(S.nowCat!=="all"||S.walkOnly||S.nowPicks?' with these filters. Try Everything.':'. Try "Tomorrow 10 am".')+'</div>';
  if(later.length) h += sec("later", "Opening later today", later.length, later.slice(0,3).map(r=>r.p.n+" at "+r.st.openLabel).join(", "), "Not open yet, but worth timing your day around.", later.map(r=>resRow(r.p,r.st)).join(""), false);
  if(unknown.length) h += '<details class="more"><summary>Check before you go ('+unknown.length+')</summary><p>No fixed hours for these. Tap one for what we know.</p><div class="links" style="margin-top:8px">'+unknown.map(r=>'<button class="plink" data-open="'+r.p.id+'">'+esc(r.p.n)+'</button>').join("")+'</div></details>';
  if(closed.length) h += '<details class="more"><summary>Closed at this time ('+closed.length+')</summary><div class="links" style="margin-top:8px">'+closed.map(r=>'<button class="plink" data-open="'+r.p.id+'">'+esc(r.p.n)+'</button>').join("")+'</div></details>';
  h += '<p class="small muted">Hours come from each venue\'s site or listings, researched October 2026. Holidays, private events, and weather change things, so call ahead for anything you\'re counting on.</p>';
  return h;
}

function dayW(n, t){
  const ti = tripInfo(); if(!ti) return null;
  const x = ti.dateOf(n); return {date:x.toISOString().slice(0,10), dow:x.getUTCDay(), mins:toM(t)};
}
function chipStatus(p, W){
  if(!W || !p.hrs) return "";
  if(isSailing(p)){
    const e = eventsAt(p, W, 150)[0];
    return e ? '<span class="st open">'+(e.state==="now"?"sailing":"sails "+fmtM(e.start))+'</span>' : '<span class="st closed">no sailing then</span>';
  }
  const evs = eventsAt(p, W, 120);
  if(evs.length && !(p.hrs.hours)) return '<span class="st open">'+(evs[0].state==="now"?"on now":"starts "+fmtM(evs[0].start))+'</span>';
  const st = statusAt(p, W);
  if(st.state==="open") return st.left<=60 ? '<span class="st closing">closes '+st.closeLabel+'</span>' : '<span class="st open">open then</span>';
  if(st.state==="later") return '<span class="st later">opens '+st.openLabel+'</span>';
  if(st.state==="closed") return '<span class="st closed">closed then</span>';
  return '';
}
function planChips(it, W, editing){
  if(!it.p.length) return editing ? '' : '';
  return '<div class="links">'+it.p.map(id=>{ const p=BY[id]; if(!p) return ''; const on=pickersOf(id).length;
    return '<span class="row" style="gap:4px"><button class="plink'+(on?' picked':'')+'" data-open="'+id+'">'+esc(p.n)+'</button>'+chipStatus(p,W)
      +(editing?'<button class="plink" data-rmp="'+it.k+'|'+id+'" aria-label="Remove '+esc(p.n)+' from this stop">✕</button>':'')+'</span>'; }).join("")+'</div>';
}
const stopPt = it => { const id=(it.p||[]).find(x=>COORD[x]); return id ? [COORD[id][0],COORD[id][1]] : null; };
function dayRoute(d){
  const pts = []; d.items.forEach(it=>{ const q=stopPt(it); if(q && !(pts.length && meters(pts[pts.length-1],q)<40)) pts.push(q); });
  const start = trip.lat&&trip.lon ? [trip.lat,trip.lon] : null;
  const seq = start ? [start].concat(pts) : pts; if(seq.length<2) return null;
  const s = q => q[0].toFixed(5)+","+q[1].toFixed(5), wps = seq.slice(1,-1).slice(0,8);
  return "https://www.google.com/maps/dir/?api=1&origin="+s(seq[0])+"&destination="+s(seq[seq.length-1])+"&travelmode=walking"+(wps.length?"&waypoints="+encodeURIComponent(wps.map(s).join("|")):"");
}

     + (ti?'<span class="date-tag">'+esc(dlab(d.n))+'</span>':'')+'</div><span class="who">'+esc(d.who||"")+(trip.hotel?' · from '+esc(trip.hotel):'')+'</span></div>';

      const fixed = it.fixed!==undefined ? !!it.fixed : !!it.key;
      let li = conn + '<li'+(it.key?' class="key"':'')+'><span class="t">'+(ed?'<input class="field" type="time" id="t-'+it.k+'" value="'+esc(it.t)+'" aria-label="Time" style="padding:4px 6px">':fmtM(toM(it.t)))+'</span><div class="what">';
      const exp = ed || !!S.openStop[it.k], why = whyOf(it);

  h += '<details class="cat" id="booking"'+(S.secs.book?' open':'')+'><summary data-sec="book"><span class="t2">Booking checklist</span><span class="c">'+bdone+' of '+CHECKS.length+' done</span><span class="hint">Cruise, Preservation Hall, Snug Harbor, dinners, tours. Tap for times, prices, phones, and links.</span></summary><div class="body">'+vBook()+'</div></details>';
  return h;
}

/* Plan B / place picker for a stop */
function vAlts(sh){
  const d = plan.days.find(x=>x.n===sh.day), it = d && d.items.find(i=>i.k===sh.k);
  if(!it) return "";
  const W = dayW(d.n, it.t) || Object.assign({}, nolaNow(), {date:null, mins:toM(it.t)});
  const cur = it.p.map(id=>BY[id]).filter(Boolean);
  const kind = cur.length ? GROUP_ORDER.find(c=>cur[0].c.includes(c)) : null;
  const same = sh.same && kind;
  const q = (sh.q||"").trim().toLowerCase();
  const pool = P.filter(p=>!it.p.includes(p.id) && (!same || p.c.includes(kind)) && (!q || (p.n+" "+p.note+" "+p.a).toLowerCase().includes(q)));
  const rows = pool.map(p=>{
    if(isSailing(p)){ const e=eventsAt(p,W,150)[0]; return {p, rank:e?0:3, pillH:e?'<span class="st open">'+(e.state==="now"?"sailing now":"sails "+fmtM(e.start))+'</span>':'<span class="st closed">no sailing then</span>'}; }
    const st = statusAt(p,W), ev = eventsAt(p,W,120)[0];
    if(ev && !p.hrs.hours) return {p, rank:0, pillH:'<span class="st soon">'+(ev.state==="now"?"on now":"starts "+fmtM(ev.start))+'</span>'};
    return {p, rank: st.state==="open"?0 : st.state==="later"?1 : st.state==="unknown"?2 : 3, pillH: pill(st)};
  }).sort((a,b)=>a.rank-b.rank || a.p.d-b.p.d || a.p.n.localeCompare(b.p.n));
  const whenTxt = (W.date ? dayLabel(parseD(W.date)) : DOWL[W.dow]+" (add trip dates for exact days)") + ', ' + fmtM(W.mins);
  let h = '<div class="sheet-top"><div><span class="eyebrow">'+(sh.pick?'Add a place':'Plan B')+' · '+esc(whenTxt)+'</span><h2 id="sheet-title">'+esc(it.h)+'</h2></div><button class="close" data-close="1" aria-label="Close">×</button></div>';
  h += '<div class="row">'+(kind?'<button class="chip" data-altsame="1" aria-pressed="'+!!same+'">Same kind ('+esc(CATS[kind])+')</button><button class="chip" data-altsame="0" aria-pressed="'+!same+'">Anything</button>':'')
     + '<input class="field search" id="altq" type="search" placeholder="Search…" value="'+esc(sh.q||"")+'" aria-label="Search places"></div>';
  h += '<p class="small muted">Open places first, then ones opening later. '+(readOnly?'You can look, but only Contributors and Editors can change the plan.':'"Swap in" replaces this stop\'s place; "Add" keeps both.')+'</p>';

function vExplore(){
  const areas = [...new Set(P.map(p=>p.a))].sort();
  const q = S.q.trim().toLowerCase(), N = nolaNow();
  const openNow = p => isSailing(p) ? eventsAt(p,N,240).length>0 : (statusAt(p,N).state==="open" || eventsAt(p,N,240).length>0);
  /* everything except the type filter, so each type chip can show its count */
  const base = P.filter(p =>
    (S.area==="all" || p.a===S.area) &&
    (!S.picksOnly || pickersOf(p.id).length) &&
    (!S.exOpen || openNow(p)) &&
    (!S.exWalk || p.d===0) &&
    (!q || hay(p).includes(q))
  );
  const counts = {all: base.length}; Object.keys(CATS).forEach(c=>{ counts[c] = base.filter(p=>p.c.includes(c)).length; });
  let list = base.filter(p => S.cat==="all" || p.c.includes(S.cat));
  if(S.sort==="drive") list.sort((a,b)=>{ const x=distInfo(a), y=distInfo(b); return (x&&y) ? x.m-y.m : a.d-b.d || a.n.localeCompare(b.n); });
  if(S.sort==="name") list.sort((a,b)=>a.n.localeCompare(b.n));
  if(S.sort==="picks") list.sort((a,b)=>pickersOf(b.id).length-pickersOf(a.id).length || a.d-b.d);
  if(S.sort==="open") list.sort((a,b)=>(openNow(b)?1:0)-(openNow(a)?1:0) || a.d-b.d);
  const anyFilter = q || S.cat!=="all" || S.area!=="all" || S.picksOnly || S.exOpen || S.exWalk;
  let h = "";
  h += '<div class="head"><span class="eyebrow">Everything in one place</span><h2>Explore</h2><div class="row"><button class="btn" data-tab="river">River cruise times</button><button class="btn" data-locate="1">◎ Near me</button></div><p class="muted small">Tap the cheesecake to save a place to the kitchen table. '+(shared?'Everyone on this page sees the group\'s saves.':'Saves stay on this device.')+'</p></div>';

    + '<select class="field" id="sort" aria-label="Sort"><option value="drive"'+(S.sort==="drive"?" selected":"")+'>'+(originPt()?'Nearest to '+originPt().from:'Closest to the Quarter')+'</option><option value="open"'+(S.sort==="open"?" selected":"")+'>Open now first</option><option value="picks"'+(S.sort==="picks"?" selected":"")+'>Most saved</option><option value="name"'+(S.sort==="name"?" selected":"")+'>A–Z</option></select></div></div>';
  const extra = '<button class="chip" id="exOpen" aria-pressed="'+!!S.exOpen+'">Open now</button><button class="chip" id="exWalk" aria-pressed="'+!!S.exWalk+'">Walkable</button><button class="chip cake" id="picksOnly" aria-pressed="'+S.picksOnly+'">Kitchen table only</button>'

  h += filterBlock(S.cat, "data-cat", extra, counts, top);
  h += '<div class="row"><span class="count">Showing '+list.length+' of '+P.length+' places'+(S.cat!=="all"?' · '+esc(CATS[S.cat]):'')+(S.exOpen?' · open now':'')+(q?' · “'+esc(S.q.trim())+'”':'')+'</span></div>';
  h += list.length ? '<div class="grid">'+list.map(card).join("")+'</div>'
       : '<div class="empty">'+(S.picksOnly?'Nothing on the kitchen table yet. Tap the cheesecake on any place to save it.':'Nothing matches. Try a simpler word, or tap Clear filters.')+'</div>';
  return h;
}

    const st = checks[c.id]||{}; const by = st.done && st.by && shared ? faces([st.by]) : "";

    let x = '<li class="bk'+(st.done?' done':'')+'"><button class="check" role="checkbox" aria-checked="'+(!!st.done)+'" data-check="'+c.id+'"'+(readOnly?' disabled':'')+'><span class="box-ic"></span><span class="lbl"><span class="num">'+(i+1)+'</span> '+esc(c.t)+'</span>'+by+'</button>';

      + '<dt>Cost</dt><dd>'+esc(c.price)+'</dd>'
      + '<dt>How</dt><dd>'+esc(c.how)+'</dd>'
      + (c.ph?'<dt>Phone</dt><dd class="mono">'+esc(c.ph)+'</dd>':'')
      + '</dl>';
    if(c.tips && c.tips.length) x += '<ul class="tips">'+c.tips.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ul>';
    x += '<div class="actions">'+(c.url?'<a class="btn primary" href="'+esc(c.url)+'" target="_blank" rel="noopener">Book / website</a>':'')

    return x;
  }).join("")+'</ul>';

}

  const svg = e.target.closest && e.target.closest("svg.map"); if(!svg || e.target.closest("[data-open]")) return;
  mapDrag = {x:e.clientX, y:e.clientY, box:S.mapBox.slice(), w:svg.clientWidth, h:svg.clientHeight, svg, moved:false};
});
document.addEventListener("pointermove", e=>{
  if(!mapDrag) return;
  const d = mapDrag, dx = e.clientX-d.x, dy = e.clientY-d.y; if(Math.abs(dx)+Math.abs(dy)>3) d.moved = true;
  const lonSpan = d.box[3]-d.box[2], latSpan = d.box[1]-d.box[0];
  const dl = -dx/d.w*lonSpan, dt = dy/d.h*latSpan;
  S.mapBox = [d.box[0]+dt, d.box[1]+dt, d.box[2]+dl, d.box[3]+dl]; S.mapViewKey = "custom";
  const x0=mx(S.mapBox[2]), y0=my(S.mapBox[1]); d.svg.setAttribute("viewBox", x0.toFixed(1)+" "+y0.toFixed(1)+" "+(mx(S.mapBox[3])-x0).toFixed(1)+" "+(my(S.mapBox[0])-y0).toFixed(1));
});
document.addEventListener("pointerup", ()=>{ if(mapDrag){ const m = mapDrag.moved; mapDrag = null; if(m) render(); } });

/* ---------- location, distance, directions ---------- */
let LOC = null;
const QUARTER = [29.9584,-90.0644];
function meters(a,b){ const r=x=>x*Math.PI/180, dLa=r(b[0]-a[0]), dLo=r(b[1]-a[1]); const s=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2; return 2*6371000*Math.asin(Math.sqrt(s)); }
const coordOf = p => COORD[p.id] ? [COORD[p.id][0], COORD[p.id][1]] : null;
function originPt(){
  if(LOC && meters([LOC.lat,LOC.lon], QUARTER) < 60000) return {pt:[LOC.lat,LOC.lon], from:"you"};
  if(trip.lat && trip.lon) return {pt:[trip.lat,trip.lon], from:"your hotel"};
  return null;
}
function travel(m){ if(m<=2600){ const w=Math.max(1,Math.round(m*1.25/80)); return {mode:"walk", mins:w, txt:w+" min walk"}; } const d=Math.round(m*1.3/420)+5; return {mode:"car", mins:d, txt:"~"+d+" min by car"}; }
const miles = m => (m/1609.34<0.1?"under 0.1":(m/1609.34).toFixed(1))+" mi";
function distInfo(p){ const o=originPt(), c=coordOf(p); if(!o||!c) return null; const m=meters(o.pt,c); return Object.assign({m, from:o.from}, travel(m)); }
const shortDist = p => { const di=distInfo(p); return di ? di.txt : driveLabel(p.d); };
const distLabel = p => { const di=distInfo(p); return di ? di.txt+" · "+miles(di.m)+" from "+di.from+" (estimate)" : driveLabel(p.d)+(p.d===0?" (in or by the Quarter)":" from the Quarter"); };
function dirUrl(p, app){
  const q = encodeURIComponent(fullDest(p)), here = hereLL();
  const car = (distInfo(p)||{}).mode==="car" || (!distInfo(p) && p.d>=15);
  if(app==="apple") return "https://maps.apple.com/?saddr="+(here||"Current%20Location")+"&daddr="+q+"&dirflg="+(car?"d":"w");
  return "https://www.google.com/maps/dir/?api=1"+(here?"&origin="+here:"")+"&destination="+q+"&travelmode="+(car?"driving":"walking");
}
function dirBtns(p){ return '<a class="btn primary" href="'+dirUrl(p)+'" target="_blank" rel="noopener">Directions</a><a class="btn" href="'+dirUrl(p,"apple")+'" target="_blank" rel="noopener">Apple Maps</a>'; }
function locate(after){
  if(!navigator.geolocation){ toast("Location isn't available in this browser."); return; }
  toast("Finding you…");
  try{
    navigator.geolocation.getCurrentPosition(pos=>{
      LOC = {lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy, ts:Date.now()};
      toast(meters([LOC.lat,LOC.lon], QUARTER) < 60000 ? "Found you. Distances are now from where you are." : "You're not in New Orleans yet, so distances use your hotel or the Quarter.");
      if(after) after(); render();
    }, err=>{ toast(err && err.code===1 ? "Location was declined. Distances use your hotel or the Quarter." : "Couldn't get your location here. Open the public site link to use GPS."); },
    {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
  }catch(e){ toast("Couldn't get your location here. Open the public site link to use GPS."); }
}

/* ---------- group votes ---------- */
let votes = {};
try{ votes[LOCAL] = JSON.parse(localStorage.getItem("nola-votes")||"{}")||{}; }catch(e){ votes[LOCAL] = {}; }
const myVotes = () => votes[me()] || {};
const votersOf = (id, v) => Object.keys(votes).filter(k=>votes[k] && votes[k][id]===v);
function persistPicks(){
  const set = myPicks(), mv = myVotes();
  if(shared){ const body = {places:Object.fromEntries([...set].map(x=>[x,true])), votes:Object.assign({}, mv)}; enqueue(()=>db.doc("picks/"+uid).set(body)); }
  else { try{ localStorage.setItem("nola-picks", JSON.stringify([...set])); localStorage.setItem("nola-votes", JSON.stringify(mv)); }catch(e){} }
}
function setVote(id, v){
  if(readOnly){ toast("Only Contributors and Editors can vote."); return; }
  const mv = Object.assign({}, myVotes()); if(mv[id]===v) delete mv[id]; else mv[id]=v; votes[me()] = mv;
  const set = new Set(myPicks()); if(mv[id]==="must"||mv[id]==="maybe") set.add(id); picks[me()] = set;
  render(); persistPicks();
  if(mv[id]) toast({must:"Must do. Blanche is already dressed.", maybe:"Marked interested.", skip:"Skipped. Sophia agrees."}[v]);
}
function vSaved(){
  const ids = new Set(); Object.values(picks).forEach(s=>s.forEach(x=>ids.add(x))); Object.values(votes).forEach(v=>Object.keys(v||{}).forEach(x=>ids.add(x)));
  const N = nolaNow();
  const score = r => r.must.length*3 + r.maybe.length - r.skip.length*2 + r.saved.length*0.5;
  const rows = [...ids].map(id=>BY[id]).filter(Boolean).map(p=>({p, must:votersOf(p.id,"must"), maybe:votersOf(p.id,"maybe"), skip:votersOf(p.id,"skip"), saved:pickersOf(p.id)}))
    .sort((a,b)=>score(b)-score(a) || a.p.n.localeCompare(b.p.n));
  const inPlan = id => plan.days.filter(d=>d.items.some(it=>it.p.includes(id))).map(d=>"Day "+d.n);
  let h = '<div class="head"><span class="eyebrow">The kitchen table</span><h2>Saved</h2><p class="muted small">Everything anyone saved, ranked by the group\'s votes. '+(shared?'Everyone sees everyone\'s votes.':'Votes stay on this phone here. Use the claude.ai link to vote as a group.')+'</p></div>';
  if(!rows.length) return h + '<div class="empty">Nothing saved yet. Tap the cheesecake on any place in Today, Explore, or the Map.</div>';
  const tally = {must:rows.filter(r=>r.must.length).length, inplan:rows.filter(r=>inPlan(r.p.id).length).length};
  h += '<div class="summary"><div class="sum"><b>'+rows.length+'</b><span>Saved</span></div><div class="sum soon"><b>'+tally.must+'</b><span>Someone\'s must-do</span></div><div class="sum open"><b>'+tally.inplan+'</b><span>Already in the plan</span></div></div>';
  h += rows.map(r=>{
    const p=r.p, mv=myVotes()[p.id], ip=inPlan(p.id);
    return '<div class="res"><button class="nm" data-open="'+p.id+'">'+esc(p.n)+'</button><div class="right">'+pill(statusAt(p,N))+'</div>'
      + (WHY[p.id]?'<p class="why" style="grid-column:1 / -1">'+esc(WHY[p.id])+'</p>':'')
      + '<div class="votes" role="group" aria-label="Your vote on '+esc(p.n)+'">'+[["must","Must do"],["maybe","Interested"],["skip","Skip"]].map(([k,l])=>'<button class="vote v-'+k+'" data-vote="'+p.id+'|'+k+'" aria-pressed="'+(mv===k)+'">'+l+' <span class="cn">'+r[k].length+'</span>'+(shared?faces(r[k]):'')+'</button>').join("")+'</div>'
      + '<div class="sub2"><span>'+esc(p.a)+' · '+esc(shortDist(p))+'</span>'+(ip.length?'<span class="st open">In plan: '+ip.join(", ")+'</span>':(readOnly?'':'<button class="btn" data-addto="'+p.id+'">Add to plan</button>'))+'<a class="btn" href="'+dirUrl(p)+'" target="_blank" rel="noopener">Directions</a></div></div>';
  }).join("");
  return h;
}

/* ---------- next two hours ---------- */
function nextStopToday(W){
  const ti = tripInfo(); if(!ti || !W.date) return null;
  const d = plan.days.find(x=>ti.dateOf(x.n).toISOString().slice(0,10)===W.date); if(!d) return null;
  const it = d.items.find(i=>toM(i.t) > W.mins); return it ? {d, it, inMins:toM(it.t)-W.mins} : null;
}
function vNext2(W){
  const ns = nextStopToday(W), budget = ns ? Math.max(30, ns.inMins) : 120;
  const BK = [["Eat",["eat","coffee"]],["Drink",["drink","party","queer"]],["Music",["jazz"]],["Do",["history","spooky","shop","river","nature","tattoo"]]];
  const cand = [];
  P.forEach(p=>{
    if(S.walkOnly && p.d!==0) return;
    const ev = eventsAt(p,W,Math.min(budget,120))[0];
    if(ev){ cand.push({p, note: ev.state==="now" ? "On now, ends "+fmtM(ev.end) : "Starts "+fmtM(ev.start)+" ("+ev.inMins+" min)"}); return; }
    if(isSailing(p)) return;
    const st = statusAt(p,W); if(st.state==="open" && st.left>=Math.min(75,budget)) cand.push({p, note:"Open till "+st.closeLabel});
  });
  const rank = c => { const di=distInfo(c.p); return (di?di.m/80:c.p.d*6) - pickersOf(c.p.id).length*10 - votersOf(c.p.id,"must").length*15; };
  let h = '<section class="next2"><div class="n2-head"><h3>Your next '+(ns?dur(budget):'2 hours')+'</h3><button class="close" data-next2="0" aria-label="Close">×</button></div>';
  h += ns ? '<p class="small">Next on the plan: <b>'+esc(ns.it.h)+'</b> at '+fmtM(toM(ns.it.t))+', in '+dur(ns.inMins)+'. These fit before it.</p>' : '<p class="small muted">Open for at least another hour, or starting soon. Closest first'+(originPt()?' from '+originPt().from:'')+'.</p>';
  h += '<div class="n2-grid">'+BK.map(([lab,cats])=>{
    const g = cand.filter(c=>cats.some(x=>c.p.c.includes(x))).sort((a,b)=>rank(a)-rank(b)).slice(0,3);
    return '<div class="n2-col"><span class="fg-l">'+lab+'</span>'+(g.length?g.map(c=>'<button class="n2-item" data-open="'+c.p.id+'"><b>'+esc(c.p.n)+'</b><span>'+esc(c.note)+' · '+esc(shortDist(c.p))+'</span></button>').join(""):'<span class="small muted">Nothing fits right now.</span>')+'</div>';
  }).join("")+'</div></section>';
  return h;
}

/* ---------- real map (Leaflet); falls back to the sketch map when tiles can't load ---------- */
let LMAP=null, LCL=null, LZONES=null, LME=null, mapEl=null, tileOk=false, tileErr=0, LDARK=null;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888";
const mapAvailable = () => !!(window.L && window.L.map) && !S.noTiles;
function isDark(){ const t=document.documentElement.getAttribute("data-theme"); return t==="dark" || (t!=="light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
function ensureMap(slot){
  if(!mapEl){ mapEl = document.createElement("div"); mapEl.className = "leafmap"; mapEl.setAttribute("aria-label","Map of New Orleans places"); }
  slot.appendChild(mapEl);
  if(!LMAP){
    LMAP = L.map(mapEl, {zoomControl:true, tap:true}).setView([29.9585,-90.0640], 15);
    LDARK = isDark();
    const tl = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(LMAP);
    if(LDARK) mapEl.classList.add("dark");
    tl.on("tileload", ()=>{ tileOk = true; });
    tl.on("tileerror", ()=>{ tileErr++; if(!tileOk && tileErr>=4){ S.noTiles = true; toast("Street tiles can't load here, so this is the sketch map. The public site link has the full map."); render(); } });
    LCL = L.markerClusterGroup ? L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:38, spiderfyOnMaxZoom:true,
      iconCreateFunction:c=>L.divIcon({html:'<span>'+c.getChildCount()+'</span>', className:'clu', iconSize:[38,38]})}) : L.layerGroup();
    LCL.addTo(LMAP);
    LZONES = L.layerGroup(); LME = L.layerGroup().addTo(LMAP);
    LMAP.on("moveend", updateMapList);
  }
  applyLock(slot);
  setTimeout(()=>{ LMAP.invalidateSize(); if(S.mapGo){ const g=S.mapGo; S.mapGo=null; if(g==="all") fitAll(); else LMAP.setView(g[0], g[1]); } updateMapList(); }, 30);
}
const isTouch = () => !!(window.matchMedia && matchMedia("(pointer:coarse)").matches);
const isPhone = () => !!(window.matchMedia && matchMedia("(max-width:899px)").matches);
const mapShown = () => S.mapShown!==undefined ? S.mapShown : !isPhone();
function applyLock(slot){
  if(!LMAP || !isTouch()) return;
  const on = !!S.mapUnlocked;
  [LMAP.dragging, LMAP.touchZoom].forEach(hd=>{ if(hd) on ? hd.enable() : hd.disable(); });
  let b = slot.querySelector(".maplock");
  if(!b){ b = document.createElement("button"); b.className = "maplock"; b.setAttribute("data-maplock","1"); slot.appendChild(b); }
  b.textContent = on ? "Done moving the map" : "Tap here to move the map";
  b.classList.toggle("on", on);
}
document.addEventListener("click", e=>{
  const el = e.target.closest && e.target.closest("[data-maplock],[data-mapshow]"); if(!el) return;
  if(el.hasAttribute("data-maplock")){ S.mapUnlocked = !S.mapUnlocked; const slot = el.parentElement; applyLock(slot); return; }
  S.mapShown = el.getAttribute("data-mapshow")==="1"; S.mapUnlocked = false; render();
  if(S.mapShown) setTimeout(()=>{ const m = document.getElementById("mapanchor"); if(m) m.scrollIntoView({block:"start", behavior:"smooth"}); }, 60);
});
function mapList(){
  const N = S.when || nolaNow(), cat = S.mapCat||"all";
  return P.filter(p=>COORD[p.id] && (cat==="all"||p.c.includes(cat)) && (!S.mapSaved||pickersOf(p.id).length) &&
    (!S.mapOpen || (isSailing(p) ? eventsAt(p,N,240).length>0 : statusAt(p,N).state==="open")));
}
function pinColor(p){
  const N = S.when || nolaNow();
  if(S.mapColor==="open"){ const st=statusAt(p,N); return cssVar(st.state==="open"?"--leaf":st.state==="later"?"--gold":st.state==="unknown"?"--muted":"--line"); }
  return cssVar(["--coral","--lav","--gold","--accent"][groupIx(p)]);
}
function updateMarkers(){
  if(!LMAP) return;
  LCL.clearLayers();
  mapList().forEach(p=>{
    const saved = pickersOf(p.id).length>0;
    const mk = L.circleMarker(coordOf(p), {radius:saved?10:8, color:saved?cssVar("--coral"):cssVar("--ink"), weight:saved?3:1.5, fillColor:pinColor(p), fillOpacity:.95});
    mk.bindTooltip(p.n, {direction:"top", offset:[0,-8]});
    mk.on("click", ()=>{ S.sheet = p.id; render(); });
    LCL.addLayer(mk);
  });
  LZONES.clearLayers();
  if(S.mapSafety){
    const col = {green:cssVar("--safe"), yellow:cssVar("--mid"), red:cssVar("--risk")};
    SAFETY.forEach(([lv,nm,poly])=>{ L.polygon(poly, {color:col[lv], weight:1, fillColor:col[lv], fillOpacity:.14, dashArray:"4 4", interactive:true}).bindTooltip(nm+": "+SAFE_TXT[lv], {sticky:true}).addTo(LZONES); });
    if(!LMAP.hasLayer(LZONES)) LZONES.addTo(LMAP);
  } else if(LMAP.hasLayer(LZONES)) LMAP.removeLayer(LZONES);
  LME.clearLayers();
