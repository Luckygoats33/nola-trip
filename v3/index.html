let wq = Promise.resolve();
function enqueue(fn){
  wq = wq.then(fn).catch(e=>{
    if(e && e.code==="invalid_argument"){ readOnly=true; toast("You can see the group's plan but can't change it."); render(); }
    else toast("Couldn't save that. Try again in a moment.");
  });
}
function togglePick(id){
  if(readOnly){ toast("You can see the kitchen table but can't change it."); return; }
  const set = new Set(myPicks()), had = set.has(id); had ? set.delete(id) : set.add(id);
  picks[me()] = set; render();
  if(had) toast("Removed from your plans.");
  else toast(["Added to your plans.","Blanche would approve.","Pass the cheesecake.","Sophia says it's a good one."][set.size%4]);
  persistPicks();
}
function toggleCheck(id){
  if(readOnly) return;
  const cur = !!(checks[id] && checks[id].done);
  checks[id] = {done:!cur, by:shared?uid:null}; render();
  if(shared) enqueue(()=>db.doc("checks/"+id).set({done:!cur, by:uid}));
  else { try{ localStorage.setItem("nola-checks", JSON.stringify(checks)); }catch(e){} }
}
function geocodeHotel(){
  const q = (trip.addr || trip.hotel || "").trim(); if(!q) return;
  try{
    fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q+", New Orleans, LA")).then(r=>r.json()).then(j=>{
      if(!j || !j[0]) return;
      trip.lat = +j[0].lat; trip.lon = +j[0].lon; render(); toast("Found your hotel on the map. Distances now start there.");
      if(shared) enqueue(()=>db.doc("trip/info").set(Object.assign({}, trip)));
      else { try{ localStorage.setItem("nola-trip", JSON.stringify(trip)); }catch(e){} }
    }).catch(()=>{});
  }catch(e){}
}
function saveTrip(){
  const dr = S.draft || {};
  if(dr.arrive && dr.depart && parseD(dr.depart) < parseD(dr.arrive)){ toast("The leave date is before the arrive date."); return; }
  trip = {arrive:dr.arrive||"", depart:dr.depart||"", hotel:(dr.hotel||"").trim(), addr:(dr.addr||"").trim()}; if(trip.hotel===TRIP_DEFAULT.hotel && trip.addr===TRIP_DEFAULT.addr){ trip.lat=TRIP_DEFAULT.lat; trip.lon=TRIP_DEFAULT.lon; }
  S.editing=false; S.draft=null; render(); toast("Trip details saved.");
  geocodeHotel();
  if(shared) enqueue(()=>db.doc("trip/info").set(trip));
  else { try{ localStorage.setItem("nola-trip", JSON.stringify(trip)); }catch(e){} }
}
async function refreshProfiles(){
  if(!user) return;
  const ids = new Set(Object.keys(picks).concat(Object.keys(votes)).filter(k=>k!==LOCAL));
  Object.values(checks).forEach(c=>{ if(c && c.by) ids.add(c.by); });
  if(!ids.size) return;
  profiles = await user.profiles([...ids]); render();
}

        picks[uid] = new Set(localPicks);
        enqueue(()=>db.doc("picks/"+uid).set({places:Object.fromEntries([...localPicks].map(x=>[x,true]))}));
      }
    }
    render(); refreshProfiles();
  }, ()=>{});
  db.collection("checks").onSnapshot(snap=>{
    const next = {};
    snap.docs.forEach(doc=>{ if(doc.exists) next[doc.id]=doc.data(); });
    checks = next; render(); refreshProfiles();
  }, ()=>{});
  db.doc("plan/main").onSnapshot(snap=>{
    if(snap.exists){ const v = snap.data(); if(Array.isArray(v.days) && v.days.length){ plan = JSON.parse(JSON.stringify({days:v.days})); render(); } }
  }, ()=>{});
  db.doc("trip/info").onSnapshot(snap=>{
    if(snap.exists && snap.data().arrive){ const t=snap.data(); trip={arrive:t.arrive||"", depart:t.depart||"", hotel:t.hotel||"", addr:t.addr||"", lat:t.lat||null, lon:t.lon||null}; render(); }
  }, ()=>{});
})();

function loadWX(){
  try{ fetch("https://api.open-meteo.com/v1/forecast?latitude=29.95&longitude=-90.07&current=temperature_2m,weather_code&hourly=precipitation_probability&temperature_unit=fahrenheit&timezone=America%2FChicago&forecast_days=2")
    .then(r=>r.json()).then(j=>{ const t=j.current.time.slice(0,13), H=j.hourly, i0=Math.max(0,H.time.findIndex(x=>x.slice(0,13)>=t));
      WX = {temp:Math.round(j.current.temperature_2m), code:j.current.weather_code, rain:Math.max(0,...H.precipitation_probability.slice(i0,i0+3))}; render(); }).catch(()=>{}); }catch(e){}
}

/* ---------- surprise me ---------- */
S.surp = {mood:null, hrs:null, mode:null, seed:1}; S.surpRes = null;
function rng(seed){ let x = seed*9301+49297; return ()=>{ x = (x*9301+49297)%233280; return x/233280; }; }
function dwellOf(p){ return has(p,"river") ? 120 : has(p,"eat","jazz","drink","party","queer") ? 60 : has(p,"history","spooky","cats","tattoo") ? 45 : 35; }
function runSurprise(startW){
  const W = startW || nolaNow(), o = originPt(), start = o ? o.pt : QUARTER, r = rng(S.surp.seed+S.surp.hrs*7+S.surp.mood.length);
  const maxLeg = S.surp.mode==="walk" ? 1600 : 9000, total = S.surp.hrs*60;
  let pool = colPlaces(S.surp.mood).filter(p=>coordOf(p));
  const stops = []; let cur = start, t = W.mins;
  for(let k=0; k<4; k++){
    const left = total-(t-W.mins); if(left < 35) break;
    const cands = pool.filter(p=>!stops.some(s=>s.p.id===p.id)).map(p=>{
      const m = meters(cur, coordOf(p)); if(m > maxLeg) return null;
      const leg = S.surp.mode==="walk" ? travel(Math.min(m,2600)) : (m<900 ? travel(m) : {mins:Math.round(m*1.3/420)+6, txt:"~"+(Math.round(m*1.3/420)+6)+" min by car"});
      const at = t + leg.mins, Wa = {date:W.date, dow:W.dow, mins:at % 1440};
      const ev = eventsAt(p, Wa, 40)[0], st = statusAt(p, Wa), dw = Math.min(dwellOf(p), left-leg.mins);
      if(dw < 25) return null;
      if(isSailing(p)){ if(!ev) return null; }
      else if(!(st.state==="open" && st.left>=dw*0.7) && !ev) return null;
      const varied = stops.length && stops[stops.length-1].p.c[0]===p.c[0] ? 1.6 : 1;
      return {p, m, leg, at: ev && ev.state==="soon" ? Math.max(at, ev.start) : at, dw, score:(m+300)*varied*(0.6+r()*0.9) - pickersOf(p.id).length*400};
    }).filter(Boolean).sort((a,b)=>a.score-b.score);
    if(!cands.length) break;
    const pick = cands[Math.floor(r()*Math.min(3,cands.length))];
    stops.push({p:pick.p, at:pick.at, dw:pick.dw, leg:pick.leg}); cur = coordOf(pick.p); t = pick.at + pick.dw;
  }
  return {stops, end:t, from:o?o.from:"the French Quarter", made:Date.now(), later:!!startW, startMins:W.mins};
}
/* plan now; if nothing in that mood is open, plan the next good window instead */
function surpriseNow(){
  let R = runSurprise(); if(R.stops.length) return R;
  const N = nolaNow(), tryAt = [N.mins<10*60 ? Object.assign({},N,{mins:10*60}) : null, N.mins<18*60 ? Object.assign({},N,{mins:18*60}) : null, shiftW(Object.assign({},N,{mins:0}),1440+10*60)].filter(Boolean);
  for(const W of tryAt){ R = runSurprise(W); if(R.stops.length) return R; }
  return R;
}
function surpDefaults(){ const s = S.surp, hr = Math.floor(nolaNow().mins/60); return {mood: s.mood || (hr>=17 || hr<3 ? "jazz" : hr<11 ? "locals" : "hidden"), hrs: s.hrs || 2, mode: s.mode || "walk"}; }
const surpriseNowBase = surpriseNow;
surpriseNow = function(){ const s = S.surp, keep = {mood:s.mood, hrs:s.hrs, mode:s.mode}, d = surpDefaults(); Object.assign(s, d); let r; try{ r = surpriseNowBase.apply(this, arguments); } finally { Object.assign(s, keep); } if(r){ r.used = d; r.auto = {mood:!keep.mood, hrs:!keep.hrs, mode:!keep.mode}; } return r; };
function surpriseCard(){
  const s = S.surp;
  const d0 = surpDefaults();
  let h = '<section class="surprise" id="surprise"><div class="sh"><h3>Surprise us, New Orleans</h3></div><p class="small muted">A mini-adventure from places open right now. Answer any of these, or skip them all and we\'ll pick for the hour.</p>';
  h += '<div class="sstep"><span class="snum">1</span><div class="sbody"><b>What\'s the vibe?</b><span class="shint">'+(s.mood?'Tap again to clear':'Optional · we\'d pick '+esc((MOODS.find(m=>m[0]===d0.mood)||[,""])[1])+' right now')+'</span><div class="seg" role="group" aria-label="Vibe">'+MOODS.map(([k,l])=>'<button class="chip" data-surp="mood:'+k+'" aria-pressed="'+(s.mood===k)+'">'+esc(l)+'</button>').join("")+'</div></div></div>';
  h += '<div class="sstep"><span class="snum">2</span><div class="sbody"><b>How long have you got?</b><span class="shint">'+(s.hrs?'Tap again to clear':'Optional · 2 hours if you skip')+'</span><div class="seg" role="group" aria-label="Time">'+[1,2,3,4].map(n=>'<button class="chip" data-surp="hrs:'+n+'" aria-pressed="'+(s.hrs===n)+'">'+n+' hr'+(n>1?'s':'')+'</button>').join("")+'</div></div></div>';
  h += '<div class="sstep"><span class="snum">3</span><div class="sbody"><b>How are you getting around?</b><span class="shint">'+(s.mode?'Tap again to clear':'Optional · walking if you skip')+'</span><div class="seg" role="group" aria-label="Getting around">'+[["walk","Walking"],["ride","Rideshare"]].map(([k,l])=>'<button class="chip" data-surp="mode:'+k+'" aria-pressed="'+(s.mode===k)+'">'+l+'</button>').join("")+'</div></div></div>';
  h += '<div class="row"><button class="btn primary big" data-surprun="go">Find our adventure</button>'+(S.surpRes?'<button class="btn" data-surprun="again">Spin again</button>':'')+((s.mood||s.hrs||s.mode)?'<button class="btn" data-surpclear="1">Clear choices</button>':'')+'</div>';
  const R = S.surpRes;

    if(!R.stops.length) h += '<div class="empty">Nothing in that mood fits in the next day. Try another mood, more time, or Rideshare.</div>';

      const pts = R.stops.map(st=>coordOf(st.p)), o = originPt(), seq = (o?[o.pt]:[]).concat(pts), sp = q=>q[0].toFixed(5)+","+q[1].toFixed(5);

    }
  }

}

function tripDayParts(n){
  const ti = tripInfo();
  if(!ti) return {chip:"Day "+n, long:"Day "+n, extra:""};
  const x = ti.dateOf(n);
  let extra = "";
  if(ti.D && x>ti.D) extra = "After you leave";
  else if(ti.D && x.getTime()===ti.D.getTime()) extra = "Departure day";
  return {chip:fmtD(x,{weekday:"short"})+" "+x.getUTCDate(), long:fmtD(x,{weekday:"long",month:"long",day:"numeric"}), extra};
}

function vDayTimeline(){
  const days = plan.days;

  let from = ADD_FROM, to = ADD_TO;
  items.forEach(it=>{
    const s = itemSpan(it);
    const a = Math.floor(s.start/ADD_STEP)*ADD_STEP;
    const b = Math.max(a, Math.ceil(s.end/ADD_STEP)*ADD_STEP - ADD_STEP);
    if(a<from) from = Math.max(0, a);
    if(b>to) to = Math.min(23*60+30, b);
  });
  const rows = Math.round((to-from)/ADD_STEP)+1;
  const placed = [], colEnds = [];
  items.forEach(it=>{
    const s = itemSpan(it);
    let a = Math.floor(s.start/ADD_STEP)*ADD_STEP;
    let b = Math.ceil(s.end/ADD_STEP)*ADD_STEP;
    if(b<=a) b = a+ADD_STEP;
    a = Math.max(from, a);
    b = Math.min(to+ADD_STEP, b);
    const slots = Math.max(1, Math.round((b-a)/ADD_STEP));
    let col = colEnds.findIndex(end=>end<=a);
    if(col<0){ col = colEnds.length; colEnds.push(a+slots*ADD_STEP); }

  }).join("")+'</div></nav>';
  h += '<p class="muted small">'+(items.length?items.length+(items.length===1?' thing':' things')+' scheduled.':'Nothing scheduled yet.')+' Tap the pencil on any event to edit times. Prev, Next, or a day above switches days.</p>';
  h += '<div class="row"><button type="button" class="btn primary" data-dayadd="1"'+(readOnly?' disabled':'')+'>Add a custom event</button></div>';
  h += '<div class="dayboard" style="grid-template-columns:68px repeat('+colCount+',minmax(0,1fr))" role="grid" aria-label="Schedule for '+esc(parts.long)+'">';
  for(let i=0;i<rows;i++){
    const m = from + i*ADD_STEP;

    h += '<div class="daytime'+(hour?' hour':'')+'" style="grid-row:'+(i+1)+'" role="rowheader">'+fmtClock(m)+'</div>';
    for(let c=0;c<colCount;c++) h += '<div class="daylane'+(hour?' hour':'')+'" style="grid-column:'+(c+2)+';grid-row:'+(i+1)+'"></div>';
  }
  placed.forEach(p=>{
    const it = p.it, row = Math.round((p.a-from)/ADD_STEP)+1;

    if(!readOnly) h += '<button type="button" class="dayev-edit" data-evedit="'+it.k+'" aria-label="Edit '+esc(it.h||"stop")+'">&#9998;</button>';

  });
  h += '</div>';
  if(S.editingEv){

const PAGE_NAMES = {help:"Help & guide", girl:"Golden Girl picks", home:"Home", map:"Map", explore:"Explore", cal:"Calendar", trip:"Calendar", plan:"Calendar", saved:"Saved", col:"Collection", river:"River cruises", info:"Trip details & settings", now:"Open right now", all:"All places"};
function routeFromState(){
  if(S.tab==="ink" || S.tab==="time" || S.tab==="birthday") S.tab = "home";
  let r = S.tab;
  if(S.tab==="col") r += "."+S.col;
  else if(S.tab==="girl") r += "."+S.girl;
  else if((S.tab==="cal" || S.tab==="trip") && S.day) r += "."+S.day;
  else if(S.tab==="saved" && S.savedTab && S.savedTab!=="picks") r += "."+S.savedTab;
  else if(S.tab==="map" && S.mapCol && S.mapCol!=="all") r += "."+S.mapCol;
  if(S.sheet && (S.sheet.mode==="aiink" || S.sheet.mode==="ink")) S.sheet = null;
  if(typeof S.sheet==="string" && BY[S.sheet]) r += "~place."+S.sheet;
  return r;
}
function applyRoute(hash){
  const h = (hash||"").replace(/^#/,""); if(!h) return false;
  const [base, sh] = h.split("~"), [v, arg] = base.split("."), view = (v==="plan" || v==="trip") ? "cal" : v;
  if(view==="ink" || view==="time" || view==="birthday"){ S.tab = "home"; S.sheet = null; return true; }
  if(!VIEWKEYS.includes(view)) return false;
  S.tab = view;
  if(view==="col" && arg && COL[arg]) S.col = arg;
  if(view==="cal" && arg) S.day = +arg || 1;
  if(view==="saved") S.savedTab = ["picks"].includes(arg) ? arg : "mine";
  if(view==="map") S.mapCol = arg && COL[arg] ? arg : "all";
  if(view==="girl") S.girl = GIRLS[arg] ? arg : "Blanche";
  S.sheet = null;
  if(sh){ const i = sh.indexOf("."), kind = sh.slice(0,i), id = sh.slice(i+1);
    if(kind==="place" && BY[id]) S.sheet = id;
  }
  return true;
}
function pageTitle(){
  if(typeof S.sheet==="string" && BY[S.sheet]) return BY[S.sheet].n;
  if(S.tab==="col") return (COL[S.col]||{}).t || "Collection";

  function doroArm(){
    const key = S.tab + "|" + (location.hash||"") + "|" + (S.sheet ? (typeof S.sheet==="string" ? S.sheet : "s") : "");

    if(doroOff || doroShown[key]) return;
    doroTimer = setTimeout(()=>doroShow(key), 33000);
  }

/* ---------- red / yellow / green safety rating for every place (night-walking guidance from the map's zones) ---------- */
(function(){
  if(typeof SAFETY === "undefined" || typeof coordOf !== "function") return;
  const RANK = {green:1, yellow:2, red:3};
  const LABEL = {green:"Safe to walk", yellow:"Use caution at night", red:"Take a car at night"};
  function inPoly(lat, lon, poly){ let inside = false; for(let i = 0, j = poly.length - 1; i < poly.length; j = i++){ const [yi, xi] = poly[i], [yj, xj] = poly[j]; if(((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi)) inside = !inside; } return inside; }
  const cache = {};
  window.safetyOf = function(p){
    if(!p) return null; if(cache[p.id]) return cache[p.id];
    const c = coordOf(p); let lv = null, zone = null, src = null;
    /* where zones overlap, the smallest (most specific) zone wins */
    const area = poly => Math.abs(poly.reduce((acc, [y1, x1], i) => { const [y2, x2] = poly[(i + 1) % poly.length]; return acc + x1 * y2 - x2 * y1; }, 0)) / 2;
    let best = Infinity; if(c) SAFETY.forEach(([l, nm, poly])=>{ if(inPoly(c[0], c[1], poly)){ const A = area(poly); if(A < best){ best = A; lv = l; zone = nm; src = "zone"; } } });
    const FIX = {palmpine:["yellow","Rampart St edge of the Quarter"], soileddove:["yellow","Rampart St edge of the Quarter"]};
    if(FIX[p.id]){ lv = FIX[p.id][0]; zone = FIX[p.id][1]; src = "place"; }
    let why;
    if(lv) why = zone + ". " + SAFE_TXT[lv];
    else if(p.c.includes("river")) { lv = "green"; src = "place"; why = "A staffed riverboat or ferry from the French Quarter riverfront. Walk to the dock along busy, well-lit Decatur St."; }
    else if((p.d||0) >= 15 || p.c.includes("daytrip")) { lv = "green"; src = "place"; why = "An out-of-town daytime trip by car or tour van. Low risk; plan to be back before dark."; }
    else { lv = "yellow"; src = "fallback"; why = "Outside the main visitor zones. Fine by day; take a rideshare after dark."; }
    return cache[p.id] = {lv, why, label:LABEL[lv], src, zone: zone || ""};
  };
  function badge(p){ const s = safetyOf(p); return '<div class="safe-badge '+s.lv+'"><span class="sdot '+s.lv+'" aria-hidden="true"></span><div><b>'+s.label+'</b><span>'+esc(s.why)+'</span></div></div>'; }
  function dot(p){ const s = safetyOf(p); return '<span class="sdot '+s.lv+' mini" role="img" aria-label="'+esc(s.label)+'" title="'+esc(s.label+": "+s.why)+'"></span>'; }
  let busy = false;
  function enhance(){
    if(busy) return; busy = true;
    try{
      /* the open place panel */
      const id = typeof S.sheet === "string" ? S.sheet : null, sh = document.querySelector("#sheet-root .sheet");
      if(id && BY[id] && sh && !sh.querySelector(".safe-badge")){
        const anchor = sh.querySelector(".rt") || sh.querySelector(".sheet-top") || sh.firstElementChild;
        if(anchor) anchor.insertAdjacentHTML("afterend", badge(BY[id]));
      }
      /* list rows, cards and top picks get a small colored dot */
      document.querySelectorAll(".res [data-open], .card [data-open], .meow-name, [data-meowopen]").forEach(el=>{
        let pid = el.getAttribute("data-open") || el.getAttribute("data-meowopen");
        let host = el;
        if(el.classList.contains("meow-name")){ const li = el.closest("li"); const b = li && li.querySelector("[data-meowopen]"); pid = b && b.getAttribute("data-meowopen"); host = el.querySelector("b"); }
        if(!pid || !BY[pid] || !host || host.querySelector(".sdot") || (el.hasAttribute("data-meowopen") && !el.classList.contains("meow-name"))) return;
        if(el.closest(".sheet")) return;
        host.insertAdjacentHTML("beforeend", " " + dot(BY[pid]));
      });
    }finally{ busy = false; }
  }
  let t = null;
  new MutationObserver(()=>{ clearTimeout(t); t = setTimeout(enhance, 30); }).observe(document.body, {childList:true, subtree:true});
  const css = document.createElement("style");
  css.textContent = `
  .sdot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;vertical-align:middle;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
  .sdot.mini{width:10px;height:10px;margin-left:4px}
  .sdot.green{background:#1E9E5A}.sdot.yellow{background:#E6B219}.sdot.red{background:#D23B3B}
  .safe-badge{display:flex;gap:10px;align-items:flex-start;margin:10px 0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
  .safe-badge .sdot{margin-top:4px;width:14px;height:14px}
  .safe-badge b{display:block;color:var(--ink);font-size:.92rem}
  .safe-badge span{display:block;color:var(--ink);opacity:.85;font-size:.82rem;line-height:1.4}
  .safe-badge.green{border-left:5px solid #1E9E5A}.safe-badge.yellow{border-left:5px solid #E6B219}.safe-badge.red{border-left:5px solid #D23B3B}
  `;
  document.head.appendChild(css);
  enhance();
})();

/* ---------- a photo for every place: big on the details panel, thumbnails in lists (Wikimedia Commons, credited) ---------- */
(function(){
  if(typeof PLACE_PHOTOS === "undefined") return;
  const src = id => "places/" + id + ".webp";
  function figure(id){
    const c = PLACE_PHOTOS[id]; if(!c) return "";
    const credit = esc(c.author || "Unknown") + ' · <a href="'+esc(c.source)+'" target="_blank" rel="noopener">'+esc(c.license)+'</a>';
    return '<figure class="pimg"><img src="'+src(id)+'" alt="'+esc(c.fallback ? c.fallback : BY[id] ? BY[id].n : "")+'" width="640" height="400" decoding="async">'
      + '<figcaption>'+(c.fallback ? '<span class="pfb">'+esc(c.fallback)+'</span> · ' : '')+'Photo: '+credit+'</figcaption></figure>';
  }
  let busy = false;
  function enhance(){
    if(busy) return; busy = true;
    try{
      const id = typeof S.sheet === "string" ? S.sheet : null, sh = document.querySelector("#sheet-root .sheet");
      if(id && PLACE_PHOTOS[id] && sh && !sh.querySelector(".pimg")){
        const top = sh.querySelector(".sheet-top"); if(top) top.insertAdjacentHTML("afterend", figure(id)); else sh.insertAdjacentHTML("afterbegin", figure(id));
      }
      document.querySelectorAll(".res").forEach(r=>{
        if(r.querySelector(".pthumb") || r.closest(".sheet")) return;
        const b = r.querySelector("[data-open]"); const pid = b && b.getAttribute("data-open");
        if(!pid || !PLACE_PHOTOS[pid]) return;
        r.insertAdjacentHTML("afterbegin", '<img class="pthumb" src="'+src(pid)+'" alt="" loading="lazy" width="56" height="56" data-open="'+pid+'">');
        r.classList.add("has-thumb");
      });
      document.querySelectorAll(".card").forEach(c=>{
        if(c.querySelector(".pcardimg") || c.closest(".sheet")) return;
        const b = c.querySelector("[data-open]"); const pid = b && b.getAttribute("data-open");
        if(!pid || !PLACE_PHOTOS[pid]) return;
        c.insertAdjacentHTML("afterbegin", '<img class="pcardimg" src="'+src(pid)+'" alt="" loading="lazy" width="640" height="400" data-open="'+pid+'">');
      });
      document.querySelectorAll("#meowpop .meow-list>li").forEach(li=>{
        if(li.querySelector(".pthumb")) return; const b = li.querySelector("[data-meowopen]"); const pid = b && b.getAttribute("data-meowopen");
        if(pid && PLACE_PHOTOS[pid]) li.querySelector(".meow-top").insertAdjacentHTML("afterbegin", '<img class="pthumb" src="'+src(pid)+'" alt="" loading="lazy" width="56" height="56">');
      });
    }finally{ busy = false; }
  }
  let t = null;
  new MutationObserver(()=>{ clearTimeout(t); t = setTimeout(enhance, 25); }).observe(document.body, {childList:true, subtree:true});
  /* credits for every place photo, inside Help */
  if(typeof vHelp === "function"){ const vh = vHelp; vHelp = function(){ const h = vh.apply(this, arguments);
    const list = '<details class="help-acc"><summary>Place photo credits</summary><ul class="credits">'+Object.entries(PLACE_PHOTOS).filter(([id])=>BY[id]).sort((a,b)=>BY[a[0]].n.localeCompare(BY[b[0]].n)).map(([id,c])=>'<li><b>'+esc(BY[id].n)+'</b>'+(c.fallback?' ('+esc(c.fallback)+')':'')+': '+esc(c.author||"Unknown")+', <a href="'+esc(c.source)+'" target="_blank" rel="noopener">'+esc(c.license)+'</a></li>').join("")+'</ul></details>';
    const i = h.lastIndexOf('<div class="talk quip"'); return i > 0 ? h.slice(0, i) + list + h.slice(i) : h + list; }; }
  const css = document.createElement("style");
  css.textContent = `
  .pimg{margin:8px 0 10px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
  .pimg img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
  .pimg figcaption{font-size:.7rem;color:var(--muted);padding:5px 10px}.pimg figcaption a{color:var(--muted)}.pfb{font-style:italic}
  .res.has-thumb{display:grid!important;grid-template-columns:56px 1fr;column-gap:10px;align-items:center}
  .res.has-thumb>*:not(.pthumb){grid-column:2}
  .pthumb{width:56px;height:56px;border-radius:10px;object-fit:cover;grid-row:1 / span 3;align-self:start;cursor:pointer;background:var(--line)}
  .meow-top .pthumb{width:48px;height:48px;grid-row:auto}
  .pcardimg{display:block;width:calc(100% + 2px);margin:-1px -1px 8px;aspect-ratio:16/10;object-fit:cover;border-radius:14px 14px 0 0;cursor:pointer;background:var(--line)}
  `;
  document.head.appendChild(css);
  enhance();
})();

/* ---------- Ask the Girls, smarter: New Orleans knowledge + everything in the app (works without AI); richer Claude context ---------- */
(function(){
  const lc = s => String(s||"").toLowerCase();
  const W0 = () => nolaNow();
  const fmtDist = p => { const d = distInfo(p); return d ? d.txt : ""; };
  const rating = p => { const r = (window.NOLA_RATINGS||{})[p.id]; return r && r.r ? r.r.toFixed(1)+"★"+(r.n ? " ("+(r.n>=1000?(r.n/1000).toFixed(1)+"k":r.n)+" reviews)" : "") : ""; };
  const stTxt = (p, W) => { const s = statusAt(p, W); if(s.state==="open") return "open"+(s.closeLabel ? " until "+s.closeLabel : ""); if(s.state==="later") return "closed (opens at "+s.openLabel+")"; if(s.state==="unknown") return "always open or no set hours"; return "closed"; };
  const ADD = (n, base) => { const d = new Date(base + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };

  /* ---- understanding "when" ---- */
  function parseWhen(q){
    const N = W0(); let W = null, label = "right now";
    const t = q.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\b/);
    let mins = null;
    if(t && (t[3] || /\bat\b|\bby\b|\baround\b/.test(q))){ let h = +t[1] % 12; if(/p/.test(t[3]||"") || (!t[3] && h < 7)) h += 12; if(!t[3] && +t[1] === 12) h = 12; mins = h*60 + (+(t[2]||0)); }
    if(/\bnoon\b/.test(q)) mins = 12*60; if(/\bmidnight\b/.test(q)) mins = 24*60 - 1;
    if(/\btonight\b/.test(q) && mins == null) mins = 21*60;
    if(/\b(this )?morning\b/.test(q) && mins == null) mins = 10*60;
    if(/\b(this )?afternoon\b/.test(q) && mins == null) mins = 15*60;
    if(/\blate night\b|\bafter midnight\b/.test(q) && mins == null) mins = 25*60;
    const day = q.match(/\bday (\d)\b/); const ti = tripInfo();
    const dowNames = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
    const dn = dowNames.findIndex(d => q.includes(d));
    if(day && ti){ const dt = ti.dateOf(+day[1]); W = {dow:dt.getDay(), mins:mins==null ? 12*60 : mins, date:dt.toISOString().slice(0,10)}; label = "on day "+day[1]+" ("+dayLabel(dt)+")"+(mins!=null?" at "+fmtM(mins%1440):""); }
    else if(/\btomorrow\b/.test(q)){ W = {dow:(N.dow+1)%7, mins:mins==null ? 12*60 : mins, date:N.date ? ADD(1, N.date) : undefined}; label = "tomorrow"+(mins!=null?" at "+fmtM(mins%1440):""); }
    else if(dn >= 0){ const add = (dn - N.dow + 7) % 7 || 7; W = {dow:dn, mins:mins==null ? 12*60 : mins, date:N.date ? ADD(add, N.date) : undefined}; label = "on "+dowNames[dn][0].toUpperCase()+dowNames[dn].slice(1)+(mins!=null?" at "+fmtM(mins%1440):""); }
    else if(mins != null){ W = {dow:N.dow, mins, date:N.date}; if(mins >= 24*60){ W = {dow:(N.dow+1)%7, mins:mins-1440, date:N.date ? ADD(1, N.date) : undefined}; } label = (/tonight/.test(q)?"tonight":"today")+" at "+fmtM(mins%1440); }
    if(W && W.mins >= 1440){ W.mins -= 1440; }
    return {W: W || N, label, explicit: !!W};
  }

  /* ---- finding places ---- */
  const STOP = /^(the|and|what|whats|when|where|how|does|do|is|are|for|open|hours|close|closes|closing|time|phone|number|address|tell|about|get|there|can|we|you|i|me|to|of|in|on|at|a|an|it|its|that|this|near|best|good|go|going|any|some|still|right|now|today|tonight|tomorrow|day|safe|far|from|our|my|with|by|call|directions|way|much|cost|price|rating|rated|reviews|should|would|could|they|them|place|places|spot|spots|new|orleans|nola)$/;
  const DF = {}; P.forEach(p => new Set(lc(p.n).replace(/['’]/g,"").replace(/[^a-z0-9& ]/g," ").split(/\s+/)).forEach(w => { DF[w] = (DF[w]||0) + 1; }));
  const GENERIC = /^(house|houses|street|park|cafe|café|bar|pub|tour|tours|museum|garden|gardens|square|shop|shops|tattoo|tattoos|jazz|hall|cemetery|plantation|cruise|river|center|club|walk|work|drink|drinks|social|cultural|historic|french|quarter|district|point|lounge|rescue|state|city|art|arts|world|queen|creole|swamp|line|second|design|dinner|lunch|romantic|night|tonight|best|cheap|lost|wallet|weather|pack|airport|streetcar|history|difference|between|mean|happening|cat|cats|food|eat|beignet|beignets|coffee|music|dance|safe|nearest|hospital|install|save|table|kitchen|area|around|tell|about|whole|plan|doing|thing|things|stuff|done|free|spot|spots|rooftop|view|views|store|stores|salon|thrift|market|center|centre|gallery|studio)$/;
  function findPlaces(q){
    /* a full place name always wins ("is salon salon open") */
    const qq = " " + lc(q).replace(/['’]/g,"").replace(/[^a-z0-9& ]/g," ").replace(/\s+/g," ") + " ";
    const exact = P.filter(p => { const nm = lc(p.n).replace(/\(.*?\)/g,"").replace(/['’]/g,"").replace(/[^a-z0-9& ]/g," ").replace(/\s+/g," ").trim(); return nm.length > 3 && qq.includes(" " + nm + " "); }).sort((a,b) => b.n.length - a.n.length);
    if(exact.length) return exact.slice(0, 1);
    const words = lc(q).replace(/['’]/g,"").replace(/[^a-z0-9& ]/g," ").split(/\s+/).filter(w => w.length > 2 && !STOP.test(w) && !GENERIC.test(w) && (DF[w]||0) <= 3);
    if(!words.length) return [];
    const scored = P.map(p => { const n = lc(p.n).replace(/['’]/g,"").replace(/[^a-z0-9& ]/g," "); let sc = 0; words.forEach(w => { if(new RegExp("\\b"+w.replace(/[^a-z0-9]/g,"")+"(s|es|'s)?\\b").test(n)) sc += w.length + 2; }); return [p, sc]; }).filter(x => x[1] >= 5).map(([p, sc]) => { const n = lc(p.n); lc(q).replace(/['’]/g,"").split(/[^a-z0-9]+/).filter(w => w.length > 3 && GENERIC.test(w)).forEach(w => { if(n.includes(w)) sc += 1; }); return [p, sc]; }).sort((a,b) => b[1]-a[1]);
    if(!scored.length) return [];
    return scored.filter(x => x[1] === scored[0][1]).map(x => x[0]).slice(0, 3);
  }
  const CATMAP = [
    [/beignet/, p => /beignet|du monde/i.test(p.n) || (WHY[p.id]||"").toLowerCase().includes("beignet")],
    [/coffee|caf[eé]|chicory|espresso|latte/, p => p.c.includes("coffee")],
    [/breakfast|brunch/, p => p.c.includes("coffee") || /brunch|breakfast/i.test(hay(p))],
    [/jazz|live music|music|band|brass/, p => p.c.includes("jazz")],
    [/cocktail|bar\b|bars\b|drink|hurricane|sazerac|wine|beer|nightcap/, p => p.c.includes("drink")],
    [/drag|gay|queer|lgbt|pride/, p => p.c.includes("queer")],
    [/dance|dancing|club|party/, p => p.c.includes("party") || p.c.includes("queer")],
    [/vegan|vegetarian|plant.based/, p => /vegan|vegetarian|plant.based|plant-driven/i.test(hay(p))],
    [/po.?boys?|crawfish|gumbo|jambalaya|seafood|oysters?|shrimp|muffuletta|red beans|boudin|catfish|etouffee|étouffée/, p => { const d = (lc(qNow).match(/po.?boys?|crawfish|gumbo|jambalaya|seafood|oysters?|shrimp|muffuletta|red beans|boudin|catfish|etouffee|étouffée/)||[""])[0].replace(/s$/,"").replace(/po.?boy/,"po.?boy"); return d && new RegExp(d, "i").test(p.n + " " + hay(p)); }],
    [/dinner|lunch|eat|food|hungry|restaurant/, p => p.c.includes("eat")],
    [/cat|kitt/, p => /\bcats?\b|kitt|feline/i.test(hay(p))],
    [/tattoo|ink/, p => p.c.includes("tattoo")],
    [/museum/, p => /museum|cabildo|collection|presbyt|pharmacy|musée|musee/i.test(p.n)],
    [/history|historic|cemeter/, p => p.c.includes("history")],
    [/voodoo|ghost|haunt|spooky|tarot|psychic/, p => p.c.includes("spooky")],
    [/swamp|gator|alligator/, p => /swamp|gator|barataria|honey island/i.test(p.n+" "+(WHY[p.id]||""))],
    [/nature|park|garden|\boak|bayou/, p => p.c.includes("nature")],
    [/river|cruise|boat|steamboat|ferry|paddle/, p => p.c.includes("river")],
    [/shop|antique|shopping|store|souvenir/, p => p.c.includes("shop")],
    [/plantation|day trip|daytrip|outside the city/, p => p.c.includes("daytrip")],
    [/romantic|date night|date/, p => p.c.includes("date")],
    [/photo|instagram|picture spot|selfie/, p => { try{ return colPlaces("photo").includes(p); }catch(e){ return p.c.includes("photo"); } }],
    [/locals?\b|off the beaten|non.?touristy|hidden gem/, p => { try{ return colPlaces("locals").includes(p) || colPlaces("hidden").includes(p); }catch(e){ return false; } }],
    [/saints|football|superdome|game/, p => p.c.includes("sports")]
  ];

  /* ---- New Orleans know-how (works offline) ---- */
  const KB = [

    [/streetcar|street car|bus|rta|jazzy pass|public transport|transit|ferry/, () => "The streetcars and buses are run by RTA: $1.25 a ride (exact change) or get the Le Pass app for 1-, 3- or 5-day Jazzy Passes. The St. Charles line (the green one) goes Uptown through the Garden District; the Canal line goes to City Park and the cemeteries; the Riverfront line runs along the river. The Algiers ferry leaves from the foot of Canal St. RTA's info line is 504-248-3900."],

    [/po.?boy|muffuletta|praline|sazerac|hurricane drink|what to eat|must.?eat|food to try|local food/, () => "Must-tries: beignets and café au lait, a po-boy (fried shrimp or roast beef 'debris'), gumbo, a muffuletta from Central Grocery, pralines, red beans and rice, and a Sazerac (the city's official cocktail). Vegetarian? Look for fried green tomato or mushroom po-boys and z'herbes gumbo."],
    [/history|founded|1718|louisiana purchase|katrina|battle of new orleans/, () => "Quick history: founded by the French in 1718, handed to Spain in 1763 (most of the Quarter's buildings are actually Spanish-era, after fires in 1788 and 1794), back to France, then sold to the US in the 1803 Louisiana Purchase. Andrew Jackson won the Battle of New Orleans in 1815. Jazz was born here around 1900. Hurricane Katrina flooded 80% of the city in 2005."],
    [/neighbou?rhood|french quarter|marigny|bywater|garden district|treme|tremé|cbd|uptown|warehouse/, () => "The French Quarter is the old city (Bourbon is the party street, Royal has galleries and antiques). The Marigny, just downriver, has Frenchmen Street's music clubs; the Bywater beyond it has colorful houses and Crescent Park. Tremé is the historic Black neighborhood behind Rampart (birthplace of jazz; take a car at night). The CBD and Warehouse District have museums and hotels; the Garden District and Uptown are the mansion-and-oak St. Charles streetcar ride."],
    [/bourbon (st|street)? vs|frenchmen vs|bourbon or frenchmen|frenchmen or bourbon/, () => "Bourbon Street is loud, neon and touristy (fun for an hour, cheap drinks, cover bands). Frenchmen Street in the Marigny is where locals go for real live jazz in small clubs like The Spotted Cat, d.b.a. and Snug Harbor. Do both: a Bourbon walk-through, then Frenchmen for the music."],

  function helpAnswer(q){
    if(!/\bapp\b|button|\btab\b|feature|install|\bsave\b|saving|\bvote|open now|search bar|surprise me|passport|tattoo idea|design (a|my|your) tattoo|tattoo design|cheesecake|kitchen table|settings|dark mode|after dark|full tour|walkthrough|how do i use|the map work|dorothy (pop|nudge)|ask the girls/.test(q)) return null;
    const words = q.replace(/[^a-z ]/g," ").split(/\s+/).filter(w => w.length > 3 && !STOP.test(w));
    let best = null, sc = 0;
    (HELP||[]).forEach(([k, t, items]) => items.forEach(([h, a]) => { const txt = lc(t+" "+h+" "+a.replace(/<[^>]+>/g,"")); let s = 0; words.forEach(w => { if(txt.includes(w)) s += lc(h).includes(w) ? 3 : 1; }); if(s > sc){ sc = s; best = [t, h, a]; } }));
    return best && sc >= 2 ? {text:best[1]+": "+best[2].replace(/<[^>]+>/g,"")+"\n(More in the Help tab.)", ids:[]} : null;
  }

  function placeAnswer(q, ps){
    const {W, label, explicit} = parseWhen(q);

    return {text: ps.map(p => {

      const parts = [];
      const askHours = /open|close|hours|time|when/.test(q), askAddr = /address|where is|located|location|directions|how do (i|we) get/.test(q), askPh = /phone|call|number/.test(q), askSafe = /safe|danger|night/.test(q), askRate = /rating|rated|reviews|good|worth|best/.test(q), askFar = /far|walk|distance|close to|how long/.test(q), askWhy = /why|what is|what's|tell me|worth/.test(q);
      const askBook = /\bbook|\breserv|\bticket|sell out|\bline\b|\bwait\b/.test(q);
      const all = !(askHours||askAddr||askPh||askSafe||askRate||askFar||askBook);
      if(askBook) parts.push(p.n + ": " + (h.reserve ? "Booking — " + h.reserve : "No booking info on file; walk-ins are usually fine.") + (h.detail ? "\n" + h.detail : ""));
      const st0 = statusAt(p, W); if(!(st0.state !== "unknown" || askHours)) parts.push(p.n + (p.a ? " (" + p.a + ")" : "")); if(st0.state !== "unknown" || askHours) parts.push((explicit ? label[0].toUpperCase()+label.slice(1)+", " : "Right now, ") + p.n + " is " + stTxt(p, W) + ".");
      if(askHours || all) if(h.hoursText) parts.push("Hours: " + h.hoursText);
      if(askAddr || all) if(p.ad) parts.push("Address: " + p.ad + (askAddr ? "\nDirections: " + mapUrl(p) : ""));
      if(askPh || all) if(p.ph) parts.push("Phone: " + p.ph + (p.phw ? " ("+p.phw+")" : "")); else if(askPh && p.contact) parts.push("Contact: " + p.contact);
      if(askFar || all){ const d = fmtDist(p); if(d) parts.push("Distance: " + d + (distInfo(p) ? " from "+distInfo(p).from : "")); }
      if(askRate || all){ const r = rating(p); if(r) parts.push("Google: " + r); }
      if(askSafe || all) if(s) parts.push("Safety: " + s.label + " — " + s.why);
      if(askWhy || all) if(WHY[p.id]) parts.push("Why go: " + WHY[p.id]);

      if(h.reserve && (all || /book|reserv|ticket/.test(q))) parts.push("Booking: " + h.reserve);
      return parts.join("\n");
    }).join("\n\n"), ids: ps.map(p => p.id)};
  }

  function listAnswer(q){
    const hit = CATMAP.find(([re]) => re.test(q));
    const general = /^(what('| i)?s|whats|anything|everything|places?|stuff|things?)\b.*\b(open|available|going on|to do)\b|^(open|what('| i)?s open)|\b(open|available) (now|right now|tonight|near me|nearby)\b|^(where (can|should) (we|i) go|what (can|should) (we|i) do)\b|near me\??$|^near(by| us)\b/.test(q);
    const wantsList = hit || general;
    if(!wantsList) return null;
    const {W, label, explicit} = parseWhen(q);
    let pool = hit ? P.filter(hit[1]) : P.slice();
    if(hit && /cat|kitt/.test((q.match(hit[0])||[""])[0]) && typeof colPlaces === "function"){ try{ const cp = colPlaces("cats"); if(cp && cp.length) pool = cp; }catch(e){} }
    if(/cheap|free|budget|inexpensive/.test(q)) pool = pool.filter(p => /free|\$(?!\$)/i.test(p.pr||"") && !/\$\$\$/.test(p.pr||""));
    if(/walk|nearby|near|close by|close to (us|me|here|the hotel)/.test(q)) pool = pool.filter(p => { const d = distInfo(p); return d ? d.m < 1800 : p.d === 0; });
    if(/safe/.test(q)) pool = pool.filter(p => safetyOf(p).lv === "green");
    const onlyOpen = /\bopen\b|\bnow\b|right now|tonight|available|still|late|anything|near me|nearby|around here/.test(q) || explicit;
    if(/how much|price|cost|ticket|expensive/.test(q) && pool.length){ const tp = pool.slice(0, 6); return {text:"Prices — "+(hit ? (q.match(hit[0])||[""])[0] : "places")+":\n"+tp.map(p => "• "+p.n+": "+((p.hrs&&p.hrs.price)||p.pr||"see listing")).join("\n"), ids:tp.map(p => p.id)}; }
    let shown = onlyOpen ? pool.filter(p => statusAt(p, W).state === "open") : pool;
    shown.sort((a, b) => { const ra = ((window.NOLA_RATINGS||{})[a.id]||{}).r||0, rb = ((window.NOLA_RATINGS||{})[b.id]||{}).r||0; const da = distInfo(a), db = distInfo(b); const near = /near|close|walk/.test(q); return near && da && db ? da.m - db.m : (rb - ra) || ((da&&db) ? da.m - db.m : a.d - b.d); });
    const LBL = {beignet:"beignets",coffee:"coffee",breakfast:"breakfast",jazz:"live music",cocktail:"bars",bar:"bars",bars:"bars",drink:"drinks",dance:"dancing",vegan:"vegan & vegetarian",vegetarian:"vegan & vegetarian",dinner:"dinner",lunch:"lunch",eat:"food",food:"food",cat:"cat spots",cats:"cat spots",tattoo:"tattoo shops",museum:"museums",history:"history",voodoo:"Voodoo & spooky",swamp:"swamp & nature",river:"river trips",cruise:"river trips",shop:"shopping",romantic:"romantic spots",date:"date spots",drag:"LGBTQ+ spots",gay:"LGBTQ+ spots",queer:"LGBTQ+ spots",lgbt:"LGBTQ+ spots",swamp:"swamp tours",locals:"local favorites",local:"local favorites"};
    const kw = hit ? (q.match(hit[0])||[""])[0] : ""; const kind = LBL[kw] || LBL[kw.replace(/s$/,"")] || kw || "places";
    if(!shown.length){
      if(!onlyOpen || !pool.length) return {text:"I couldn't find "+kind+" for that. Try different words, or tap Open now.", ids:[]};
      const nxt = pool.map(p => { const st = statusAt(p, W); return [p, st]; }).filter(x => x[1].state==="later").sort((a,b) => a[1].opensIn - b[1].opensIn).slice(0, 4);
      return {text:"No "+kind+" open "+label+(nxt.length ? ". Next to open:\n"+nxt.map(([p,st]) => "• "+p.n+" — opens at "+st.openLabel+(fmtDist(p)?" · "+fmtDist(p):"")).join("\n") : ". Try another time, like \"tomorrow at 10am\"."), ids:nxt.map(x => x[0].id)};
    }
    const top = shown.slice(0, 6);
    if(/how much|price|cost|ticket|expensive/.test(q)) return {text:"Prices — "+kind+":\n"+top.map(p => "• "+p.n+": "+((p.hrs&&p.hrs.price)||p.pr||"see listing")).join("\n"), ids:top.map(p => p.id)};
    return {text:(onlyOpen ? "Open "+label : "Top picks")+(hit?" — "+kind:"")+":\n"+top.map(p => "• "+p.n+" — "+stTxt(p, W)+(fmtDist(p)?" · "+fmtDist(p):"")+(rating(p)?" · "+rating(p).split(" ")[0]:"")+(safetyOf(p).lv!=="green"?" · "+safetyOf(p).label.toLowerCase():"")).join("\n")+(shown.length>6?"\n…and "+(shown.length-6)+" more. Tap Open now or search to see them all.":""), ids:top.map(p => p.id)};

  function tripDayForIso(iso){

  function formatDayItems(d){
    const items = (d.items||[]).slice().sort((a,b)=>toM(a.t||"00:00")-toM(b.t||"00:00"));
    if(!items.length) return "";
    return items.map(i=>{
      const place = (i.p||[]).map(id=>BY[id]).find(Boolean);
      const where = place ? (place.n+(place.ad?" · "+place.ad:"")) : (i.d||"");
      const same = where && (where===i.h || (place && place.n===i.h));
      const when = i.end && toM(i.end)>toM(i.t) ? holdLabel(toM(i.t), toM(i.end)) : (i.t?fmtM(toM(i.t)):"");
      return "• "+(when?when+" — ":"")+(i.h||"Stop")+(where && !same ? " · "+where : "");
    }).join("\n");
  }
  function scheduleAnswer(q){
    if(/\b(saints|flight|music|band|hours|opening|cruise times)\b/.test(q)) return null;
    const aboutCal = /\b(schedule|itinerary|agenda|calendar)\b/.test(q);
    const todayish = /\b(today|tonight|this morning|this afternoon|this evening)\b/.test(q);
    const mine = /what('s| is|s) (my|our) (schedule|itinerary|calendar)|my (schedule|itinerary|calendar)|on my calendar|what do (i|we) have (today|on)/.test(q);

    const placeHit = a.ids && a.ids.length === 1 && /^Right now|^Tomorrow|^On /.test(a.text) && !new RegExp("museum", "i").test((BY[a.ids[0]]||{}).n || "") ;
    const GENERICFOOD = /^(food|eat|hungry|dinner|lunch|breakfast|brunch|snack|snacks|coffee|tea|cocktail|wine|beer|vegan|vegetarian)$/;

  /* Map tab only. Green/yellow/red zones (and the few place-level safety rules) blend with Google stars.

  var SAFE_PTS = {green:4, yellow:3, red:1.5};
